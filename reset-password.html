<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Reset Password – EatToGo</title>
  <style>.etg-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1C1208; color: white; border-radius: 16px; padding: 14px 24px; font-weight: 700; display: flex; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); opacity: 0; transition: all .35s; z-index: 9999; min-width: 300px; pointer-events: none; } .etg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }</style>
</head>
<body>
<div class="etg-toast" id="etgToast"><span id="toastIcon">⚠️</span><span id="toastMsg"></span></div>
<div class="auth-wrap"><div class="container"><form id="resetForm" class="auth-card card-etg"><a class="logo" href="index.html">Eat<span>To</span>Go</a><h1>Reset Password</h1><p class="text-muted">Enter your new password.</p><label>New Password</label><input id="password" type="password" class="form-control mb-3" required><label>Confirm Password</label><input id="confirm" type="password" class="form-control mb-4" required><button type="submit" class="btn btn-etg w-100">Reset Password</button></form></div></div>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const email = urlParams.get('email');
  let toastTimer;
  function showToast(msg, type = 'success', icon = '✅') {
    const t = document.getElementById('etgToast');
    t.className = `etg-toast ${type}`;
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastIcon').textContent = icon;
    clearTimeout(toastTimer);
    void t.offsetWidth;
    t.classList.add('show');
    toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
  }
  if (!token || !email) {
    showToast('Invalid reset link. Please request a new one.', 'error', '❌');
  }
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password !== confirm) { showToast('Passwords do not match.', 'warning', '⚠️'); return; }
    if (password.length < 4) { showToast('Password must be at least 4 characters.', 'warning', '⚠️'); return; }
    try {
      const res = await fetch('/EatToGo/api/reset-password.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, email: email, password: password })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        showToast('Password reset successful! Redirecting...', 'success', '✅');
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      } else {
        showToast(data.error || 'Reset failed', 'error', '❌');
      }
    } catch (err) { showToast('Server error', 'error', '❌'); }
  });
</script>
</body>
</html>
