<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – EatToGo</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .etg-toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: #1C1208; color: white; border-radius: 16px;
      padding: 14px 24px; font-weight: 700; font-size: 15px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
      opacity: 0; transition: all .35s; z-index: 9999; min-width: 300px;
      pointer-events: none;
    }
    .etg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .etg-toast.error { border-left: 5px solid #ef4444; }
    .etg-toast.success { border-left: 5px solid var(--green); }
    .etg-toast.warning { border-left: 5px solid var(--orange); }
    .password-hint {
      font-size: 0.75rem;
      margin-top: 4px;
      color: #dc3545;
    }
    .password-hint.valid { color: #28a745; }
    .input-group .btn-outline-secondary {
      border-top-right-radius: 14px;
      border-bottom-right-radius: 14px;
    }
  </style>
</head>
<body>
<div class="etg-toast" id="etgToast">
  <span class="toast-icon" id="toastIcon">⚠️</span>
  <span id="toastMsg">Message here</span>
</div>

<div class="auth-wrap">
  <div class="container">
    <form id="resetForm" class="auth-card card-etg">
      <a class="logo" href="index.html">Eat<span>To</span>Go</a>
      <h1 class="mt-4">Reset Password</h1>
      <p class="text-muted">Enter your new password below.</p>
      <label class="fw-bold mb-1">New Password</label>
      <div class="input-group mb-2">
        <input type="password" id="password" class="form-control" required>
        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', this)">
          <i class="bi bi-eye-slash"></i>
        </button>
      </div>
      <div id="passwordStrengthHint" class="password-hint mb-2"></div>

      <label class="fw-bold mb-1">Confirm Password</label>
      <div class="input-group mb-2">
        <input type="password" id="confirm" class="form-control" required>
        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirm', this)">
          <i class="bi bi-eye-slash"></i>
        </button>
      </div>
      <div id="confirmHint" class="password-hint mb-4"></div>

      <button type="submit" class="btn btn-etg w-100">Reset Password</button>
    </form>
  </div>
</div>

<footer class="minimal-footer">...</footer>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const email = urlParams.get('email');

  let toastTimer;
  function showToast(msg, type = 'success', icon = '✅') {
    const t = document.getElementById('etgToast');
    t.className = `etg-toast ${type}`;
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastIcon').textContent = icon;
    clearTimeout(toastTimer);
    void t.offsetWidth;
    t.classList.add('show');
    toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
  }

  if (!token || !email) {
    showToast('Invalid reset link. Please request a new one.', 'error', '❌');
  }

  // Password strength functions
  function isPasswordStrong(password) {
    const minLength = 8;
    const hasUppercase = /[A-Z]/.test(password);
    const hasLowercase = /[a-z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
    const isLongEnough = password.length >= minLength;
    return isLongEnough && hasUppercase && hasLowercase && hasNumber && hasSpecial;
  }

  function getPasswordStrengthMessage(password) {
    const checks = [
      { condition: password.length >= 8, text: "At least 8 characters" },
      { condition: /[A-Z]/.test(password), text: "At least one uppercase letter" },
      { condition: /[a-z]/.test(password), text: "At least one lowercase letter" },
      { condition: /[0-9]/.test(password), text: "At least one number" },
      { condition: /[!@#$%^&*(),.?":{}|<>]/.test(password), text: "At least one special character (!@#$%^&* etc.)" }
    ];
    const failed = checks.filter(c => !c.condition).map(c => c.text);
    if (failed.length === 0) return "✅ Strong password";
    return "❌ " + failed.join(", ");
  }

  function updatePasswordHint() {
    const password = document.getElementById('password').value;
    const hintDiv = document.getElementById('passwordStrengthHint');
    if (!hintDiv) return;
    if (password === "") {
      hintDiv.innerHTML = "";
      hintDiv.classList.remove('valid', 'invalid');
    } else if (isPasswordStrong(password)) {
      hintDiv.innerHTML = "✅ Strong password";
      hintDiv.classList.add('valid');
      hintDiv.classList.remove('invalid');
    } else {
      hintDiv.innerHTML = getPasswordStrengthMessage(password);
      hintDiv.classList.add('invalid');
      hintDiv.classList.remove('valid');
    }
  }

  function updateConfirmHint() {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const hintDiv = document.getElementById('confirmHint');
    if (!hintDiv) return;
    if (confirm === "") {
      hintDiv.innerHTML = "";
      hintDiv.classList.remove('valid', 'invalid');
    } else if (password === confirm) {
      hintDiv.innerHTML = "✅ Passwords match";
      hintDiv.classList.add('valid');
      hintDiv.classList.remove('invalid');
    } else {
      hintDiv.innerHTML = "❌ Passwords do not match";
      hintDiv.classList.add('invalid');
      hintDiv.classList.remove('valid');
    }
  }

  function togglePassword(inputId, btnElement) {
    const input = document.getElementById(inputId);
    const icon = btnElement.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('bi-eye-slash');
      icon.classList.add('bi-eye');
    } else {
      input.type = 'password';
      icon.classList.remove('bi-eye');
      icon.classList.add('bi-eye-slash');
    }
  }

  // Attach event listeners
  const pwdInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm');
  pwdInput.addEventListener('input', () => {
    updatePasswordHint();
    updateConfirmHint();
  });
  confirmInput.addEventListener('input', updateConfirmHint);

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password !== confirm) {
      showToast('Passwords do not match.', 'warning', '⚠️');
      return;
    }
    if (!isPasswordStrong(password)) {
      showToast(getPasswordStrengthMessage(password), 'warning', '⚠️');
      return;
    }
    try {
      const response = await fetch('/api/reset-password.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, email, password })
      });
      const data = await response.json();
      if (response.ok && data.success) {
        showToast('Password reset successful! Redirecting to login...', 'success', '✅');
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      } else {
        showToast(data.error || 'Reset failed', 'error', '❌');
      }
    } catch (err) {
      showToast('Server error. Please try again.', 'error', '❌');
    }
  });
</script>
</body>
</html>
