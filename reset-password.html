<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – EatToGo</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .etg-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1C1208; color: white; border-radius: 16px; padding: 14px 24px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); opacity: 0; transition: all .35s; z-index: 9999; min-width: 300px; pointer-events: none; }
    .etg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .etg-toast.error { border-left: 5px solid #ef4444; }
    .etg-toast.success { border-left: 5px solid var(--green); }
    .etg-toast.warning { border-left: 5px solid var(--orange); }
  </style>
</head>
<body>
<div class="etg-toast" id="etgToast"><span class="toast-icon" id="toastIcon">⚠️</span><span id="toastMsg">Message here</span></div>
<div class="auth-wrap">
  <div class="container">
    <form id="resetForm" class="auth-card card-etg">
      <a class="logo" href="index.html">Eat<span>To</span>Go</a>
      <h1 class="mt-4">Reset Password</h1>
      <p class="text-muted">Enter your new password below.</p>
      <label class="fw-bold mb-1">New Password</label><input id="password" type="password" class="form-control mb-3" required>
      <label class="fw-bold mb-1">Confirm Password</label><input id="confirm" type="password" class="form-control mb-4" required>
      <button type="submit" class="btn btn-etg w-100">Reset Password</button>
    </form>
  </div>
</div>
<footer class="minimal-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-5">
    <div class="footer-brand"><h2>Eat<span>To</span>Go</h2><p>Final Year Project – Restaurant and Food Reservation System.</p></div>
    <div class="footer-members"><h4>Project Team</h4><ul class="list-unstyled"><li>Navin Ramu</li><li>Muhamamd Nazim</li><li>Hadif</li><li>Ng Yue Yang</li></ul></div>
  </div>
  <div class="footer-bottom">© 2026 EatToGo • Universiti Teknologi Malaysia (UTM)</div>
</footer>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const email = urlParams.get('email');
  let toastTimer;
  function showToast(msg, type = 'success', icon = '✅') {
    const t = document.getElementById('etgToast');
    t.className = `etg-toast ${type}`;
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastIcon').textContent = icon;
    clearTimeout(toastTimer);
    void t.offsetWidth;
    t.classList.add('show');
    toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
  }
  if (!token || !email) { showToast('Invalid reset link. Please request a new one.', 'error', '❌'); }
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password !== confirm) { showToast('Passwords do not match.', 'warning', '⚠️'); return; }
    if (password.length < 4) { showToast('Password must be at least 4 characters.', 'warning', '⚠️'); return; }
    try {
      const res = await fetch('/EatToGo/api/reset-password.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, email, password }) });
      const data = await res.json();
      if (data.success) { showToast('Password reset successful! Redirecting...', 'success', '✅'); setTimeout(() => { window.location.href = 'login.html'; }, 2000); }
      else { showToast(data.error, 'error', '❌'); }
    } catch(err) { showToast('Server error', 'error', '❌'); }
  });
</script>
</body>
</html>
