<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Forgot Password</title>
  <style>
    .etg-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1C1208; color: white; border-radius: 16px; padding: 14px 24px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); opacity: 0; transition: all .35s; z-index: 9999; min-width: 300px; pointer-events: none; }
    .etg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .etg-toast.error { border-left: 5px solid #ef4444; }
    .etg-toast.success { border-left: 5px solid var(--green); }
    .etg-toast.warning { border-left: 5px solid var(--orange); }
  </style>
</head>
<body>
<div class="etg-toast" id="etgToast"><span class="toast-icon" id="toastIcon">⚠️</span><span id="toastMsg">Message here</span></div>
<div class="auth-wrap">
  <div class="container">
    <form onsubmit="forgot(event)" class="auth-card card-etg">
      <a class="logo" href="index.html">Eat<span>To</span>Go</a>
      <h1 class="mt-4">Forgot Password</h1>
      <p class="text-muted">Enter email to receive reset link.</p>
      <input id="forgotEmail" class="form-control mb-3" type="email" placeholder="Email" required />
      <button class="btn btn-etg w-100">Send Reset Link</button>
    </form>
  </div>
</div>
<script src="assets/js/api.js"></script>
<script>
  let toastTimer;
  function showToast(msg, type = 'success', icon = '✅') {
    const t = document.getElementById('etgToast');
    t.className = `etg-toast ${type}`;
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastIcon').textContent = icon;
    clearTimeout(toastTimer);
    void t.offsetWidth;
    t.classList.add('show');
    toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
  }
  function forgot(e) {
    e.preventDefault();
    const email = document.getElementById('forgotEmail').value.trim();
    if (!email) { showToast('Please enter your email.', 'warning', '⚠️'); return; }
    showToast(`Password reset link sent to ${email} (demo).`, 'success', '✅');
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
  }
</script>
</body>
</html>
