<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Forgot Password – EatToGo</title>
  <style>.etg-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1C1208; color: white; border-radius: 16px; padding: 14px 24px; font-weight: 700; display: flex; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); opacity: 0; transition: all .35s; z-index: 9999; min-width: 300px; pointer-events: none; } .etg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }</style>
</head>
<body>
<div class="etg-toast" id="etgToast"><span id="toastIcon">⚠️</span><span id="toastMsg"></span></div>
<div class="auth-wrap"><div class="container"><form id="forgotForm" class="auth-card card-etg"><a class="logo" href="index.html">Eat<span>To</span>Go</a><h1>Forgot Password</h1><p class="text-muted">Enter your email to receive a reset link.</p><input id="email" class="form-control mb-3" type="email" required><button type="submit" class="btn btn-etg w-100">Send Reset Link</button><div id="resetInfo" class="mt-3"></div></form></div></div>
<script src="assets/js/api.js"></script>
<script>
  let toastTimer; function showToast(msg,type='success',icon='✅'){ const t=document.getElementById('etgToast'); t.className=`etg-toast ${type}`; document.getElementById('toastMsg').textContent=msg; document.getElementById('toastIcon').textContent=icon; clearTimeout(toastTimer); void t.offsetWidth; t.classList.add('show'); toastTimer=setTimeout(()=>t.classList.remove('show'),3800); }
  document.getElementById('forgotForm').addEventListener('submit', async(e)=>{ e.preventDefault(); const email=document.getElementById('email').value.trim(); if(!email) return; try { const res = await fetch('api/forgot-password.php', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email }) }); const data = await res.json(); if(data.success) { showToast(data.message,'success','✅'); if(data.reset_link) { document.getElementById('resetInfo').innerHTML = `<div class="alert alert-info">Reset link: <a href="${data.reset_link}" target="_blank">${data.reset_link}</a></div>`; } else { setTimeout(()=>window.location.href='login.html',3000); } } else { showToast(data.error,'error','❌'); } } catch(err) { console.error(err); showToast('Server error.','error','❌'); } });
</script>
</body>
</html>
