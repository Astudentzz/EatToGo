<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Sign Up – EatToGo</title>
  <style>
    .etg-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1C1208; color: white; border-radius: 16px; padding: 14px 24px; font-weight: 700; display: flex; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); opacity: 0; transition: all .35s; z-index: 9999; min-width: 300px; pointer-events: none; }
    .etg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .etg-toast.error { border-left: 5px solid #ef4444; }
    .etg-toast.success { border-left: 5px solid var(--green); }
    .etg-toast.warning { border-left: 5px solid var(--orange); }
  </style>
</head>
<body>
<div class="etg-toast" id="etgToast"><span id="toastIcon">⚠️</span><span id="toastMsg">Message</span></div>
<div class="auth-wrap"><div class="container"><form id="signupForm" class="auth-card card-etg"><a class="logo" href="index.html">Eat<span>To</span>Go</a><h1>Create Account</h1><p class="text-muted" id="signupSubtitle">Join EatToGo.</p><label>Full Name</label><input id="name" class="form-control mb-3" required><label>Email</label><input id="email" type="email" class="form-control mb-3" required><label>Password</label><input id="password" type="password" class="form-control mb-3" required><label>Register as</label><select id="role" class="form-select mb-4"><option value="customer">Customer</option><option value="owner">Restaurant Owner</option><option value="staff">Staff</option></select><button type="submit" class="btn btn-etg w-100">Create Account</button><p class="mt-3"><a href="login.html">Already have an account?</a></p></form></div></div>
<script src="assets/js/api.js"></script>
<script>
  let toastTimer;
  function showToast(msg, type='success', icon='✅') { const t=document.getElementById('etgToast'); t.className=`etg-toast ${type}`; document.getElementById('toastMsg').textContent=msg; document.getElementById('toastIcon').textContent=icon; clearTimeout(toastTimer); void t.offsetWidth; t.classList.add('show'); toastTimer=setTimeout(()=>t.classList.remove('show'),3800); }
  window.addEventListener('DOMContentLoaded',()=>{ const role=new URLSearchParams(location.search).get('role'); if(role){ const sel=document.getElementById('role'); if([...sel.options].find(o=>o.value===role)) sel.value=role; if(role==='owner') document.getElementById('signupSubtitle').innerHTML='Register as Owner to list your restaurant.'; } });
  async function signup(e) { e.preventDefault(); const name=document.getElementById('name').value.trim(); const email=document.getElementById('email').value.trim(); const password=document.getElementById('password').value; const role=document.getElementById('role').value; if(!name||!email||!password) { showToast('Please fill all fields.','warning','⚠️'); return; } try { const data = await apiCall('/register.php', { method:'POST', body:JSON.stringify({ name, email, password, role }) }); if(data.success) { showToast('Account created! Redirecting...','success','✅'); setTimeout(()=>{ if(role==='admin') window.location.href='admin.html'; else if(role==='staff') window.location.href='staff-dashboard.html'; else if(role==='owner') window.location.href='owner-dashboard.html'; else window.location.href='index.html'; },1500); } else { showToast(data.error||'Registration failed','error','❌'); } } catch(err) { showToast(err.message,'error','❌'); } }
  document.getElementById('signupForm').addEventListener('submit', signup);
</script>
</body>
</html>
