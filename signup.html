<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Sign Up – EatToGo</title>
</head>
<body>
<div class="auth-wrap">
  <div class="container">
    <form onsubmit="signup(event)" class="auth-card card-etg">
      <a class="logo" href="index.html">Eat<span>To</span>Go</a>
      <h1 class="mt-4">Create Account</h1>
      <p class="text-muted" id="signupSubtitle">Join EatToGo to reserve tables and pre-order food.</p>

      <label class="fw-bold mb-1">Full Name</label>
      <input id="name" class="form-control mb-3" placeholder="Your full name" required>

      <label class="fw-bold mb-1">Email</label>
      <input id="email" class="form-control mb-3" type="email" placeholder="your@email.com" required>

      <label class="fw-bold mb-1">Password</label>
      <input class="form-control mb-3" type="password" placeholder="Create a password" required>

      <label class="fw-bold mb-1">Register as</label>
      <select id="role" class="form-select mb-4">
        <option value="customer">Customer</option>
        <option value="owner">Restaurant Owner</option>
        <option value="staff">Restaurant Staff</option>
      </select>

      <button class="btn btn-etg w-100">Create Account</button>
      <p class="mt-3"><a href="login.html">Already have an account? Sign In</a></p>
    </form>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script>
// Pre-select role if coming from owner CTA
window.addEventListener('DOMContentLoaded', async () => {
  await nav();
  const params = new URLSearchParams(location.search);
  const role = params.get('role');
  if (role) {
    const sel = document.getElementById('role');
    const opt = [...sel.options].find(o => o.value === role);
    if (opt) {
      sel.value = role;
      if (role === 'owner') {
        document.getElementById('signupSubtitle').textContent = 'Register as a Restaurant Owner to list your restaurant on EatToGo.';
      }
    }
  }
});

async function signup(e) {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.querySelector('input[type="password"]').value;
    const role = document.getElementById('role').value;
    try {
        await apiCall('/register.php', {
            method: 'POST',
            body: JSON.stringify({ name, email, password, role })
        });
        alert('Registration successful! Welcome to EatToGo.');
        window.location.href = 'index.html';
    } catch (err) {
        alert(err.message);
    }
}
</script>
</body>
</html>
