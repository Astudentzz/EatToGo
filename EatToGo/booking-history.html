<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Booking History – EatToGo</title>
</head>
<body>
<nav class="navbar-etg"><div class="container d-flex align-items-center justify-content-between"><a class="logo" href="index.html">Eat<span>To</span>Go</a><div id="mainNav" class="d-none d-md-flex gap-4"></div><div id="authArea"></div></div></nav>
<section class="page-head"><div class="container"><h1>My Bookings</h1></div></section>
<section class="section"><div class="container"><div class="card-etg p-4"><div class="table-responsive"><table class="table"><thead><tr><th>ID</th><th>Restaurant</th><th>Date & Time</th><th>Guests</th><th>Status</th><th>Arrival</th><th>Actions</th></tr></thead><tbody id="myBookingRows"></tbody></table></div><div><a href="search-results.html" class="btn btn-etg">+ New Reservation</a><a href="order-status.html" class="btn btn-outline-etg ms-2">Track Order</a></div></div></div></section>
<footer class="minimal-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-5">
    <div class="footer-brand"><h2>Eat<span>To</span>Go</h2><p>Final Year Project – Restaurant and Food Reservation System.</p></div>
    <div class="footer-members"><h4>Project Team</h4><ul class="list-unstyled"><li>Navin Ramu</li><li>Muhamamd Nazim</li><li>Hadif</li><li>Ng Yue Yang</li></ul></div>
  </div>
  <div class="footer-bottom">© 2026 EatToGo • Universiti Teknologi Malaysia (UTM)</div>
</footer>
<script src="assets/js/api.js"></script>
<script>
  async function renderMyBookings() { const tbody = document.getElementById('myBookingRows'); try { const session = await checkSession(); if (!session.loggedIn) { tbody.innerHTML = '<tr><td colspan="7">Please login.</td></tr>'; return; } let bookings = await apiCall('/user-reservations.php'); if (!bookings.length) { tbody.innerHTML = '<tr><td colspan="7">No bookings yet.</td></tr>'; return; } tbody.innerHTML = bookings.map(b => `<tr><td><b>${b.id}</b></td><td>${escapeHtml(b.restaurant_name)}</td><td>${b.reservation_date} ${b.reservation_time}</td><td>${b.num_people}</td><td><span class="status ${b.status}">${b.status}</span></td><td>${b.arrival_confirmed ? '<span class="status confirmed">Arrived</span>' : 'Not arrived'}</td><td class="d-flex gap-1">${!b.arrival_confirmed && b.status !== 'rejected' ? `<button class="btn btn-sm btn-etg" onclick="confirmArrival(${b.id})">Confirm Arrival</button>` : ''}${b.arrival_confirmed ? `<a href="feedback.html?reservation_id=${b.id}" class="btn btn-sm btn-outline-etg">Feedback</a>` : ''}<a href="order-status.html?reservation_id=${b.id}" class="btn btn-sm btn-outline-secondary">Track</a></td></tr>`).join(''); } catch(err) { tbody.innerHTML = '<tr><td colspan="7">Error loading bookings.</td></tr>'; } }
  async function confirmArrival(bookingId) { try { await apiCall('/arrival.php', { method: 'POST', body: JSON.stringify({ reservation_id: bookingId }) }); alert('Arrival confirmed.'); renderMyBookings(); } catch(err) { alert('Error: ' + err.message); } }
  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
  async function setupNav() { const s = await checkSession(); const navDiv = document.getElementById('mainNav'); if(!navDiv) return; const u = s.loggedIn ? s.user : null; if(!u || u.role==='customer') navDiv.innerHTML = `<a class="nav-link" href="search-results.html">Restaurants</a><a class="nav-link" href="booking-history.html">My Bookings</a><a class="nav-link" href="order-status.html">Order Status</a>`; else if(u.role==='staff') navDiv.innerHTML = `<a class="nav-link fw-bold" href="staff-dashboard.html">↗ Staff Dashboard</a>`; else if(u.role==='owner') navDiv.innerHTML = `<a class="nav-link fw-bold" href="owner-dashboard.html">↗ Owner Dashboard</a>`; else if(u.role==='admin') navDiv.innerHTML = `<a class="nav-link fw-bold" href="admin.html">↗ Admin Dashboard</a>`; }
  window.addEventListener('DOMContentLoaded', async () => { await nav(); await setupNav(); await renderMyBookings(); });
</script>
</body>
</html>
