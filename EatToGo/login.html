<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Login – EatToGo</title>
  <style>
    .etg-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1C1208; color: white; border-radius: 16px; padding: 14px 24px; font-weight: 700; display: flex; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); opacity: 0; transition: all .35s; z-index: 9999; min-width: 300px; pointer-events: none; }
    .etg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .etg-toast.error { border-left: 5px solid #ef4444; }
    .etg-toast.success { border-left: 5px solid var(--green); }
    .etg-toast.warning { border-left: 5px solid var(--orange); }
    .shake { animation: shake .4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
  </style>
</head>
<body>
<div class="etg-toast" id="etgToast"><span id="toastIcon">⚠️</span><span id="toastMsg">Message</span></div>
<div class="auth-wrap"><div class="container"><form id="loginForm" class="auth-card card-etg"><a class="logo" href="index.html">Eat<span>To</span>Go</a><h1>Sign In</h1><p class="text-muted">Welcome back.</p><label>Email</label><input id="email" class="form-control mb-3" type="email" required><label>Password</label><input id="password" class="form-control mb-3" type="password" required><label>Sign in as</label><select id="role" class="form-select mb-4"><option value="customer">Customer</option><option value="staff">Staff</option><option value="owner">Owner</option><option value="admin">Admin</option></select><button type="submit" class="btn btn-etg w-100">Sign In</button><div class="mt-3 d-flex justify-content-between"><a href="signup.html">Create account</a><a href="forgot-password.html">Forgot password?</a></div></form></div></div>
<script src="assets/js/api.js"></script>
<script>
  let toastTimer;
  function showToast(msg, type='error', icon='❌') { const t=document.getElementById('etgToast'); t.className=`etg-toast ${type}`; document.getElementById('toastMsg').textContent=msg; document.getElementById('toastIcon').textContent=icon; clearTimeout(toastTimer); void t.offsetWidth; t.classList.add('show'); toastTimer=setTimeout(()=>t.classList.remove('show'),3800); }
  async function doLogin(e) { e.preventDefault(); const email = document.getElementById('email').value.trim().toLowerCase(); const password = document.getElementById('password').value; const role = document.getElementById('role').value; if(!email||!password) { showToast('Please fill all fields.','warning','⚠️'); return; } try { const data = await apiCall('/login.php', { method:'POST', body:JSON.stringify({ email, password, role }) }); if(data.success) { showToast(`Welcome ${data.user.name}!`,'success','✅'); setTimeout(()=>{ if(data.user.role==='admin') window.location.href='admin.html'; else if(data.user.role==='staff') window.location.href='staff-dashboard.html'; else if(data.user.role==='owner') window.location.href='owner-dashboard.html'; else window.location.href='index.html'; },1000); } } catch(err) { showToast(err.message,'error','❌'); document.getElementById('loginForm').classList.add('shake'); setTimeout(()=>document.getElementById('loginForm').classList.remove('shake'),500); } }
  document.getElementById('loginForm').addEventListener('submit', doLogin);
</script>
</body>
</html>
