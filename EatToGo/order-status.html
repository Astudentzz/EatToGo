<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Order Status – EatToGo</title>
  <style>
    .tracker-step { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-start; }
    .step-dot { width: 40px; height: 40px; border-radius: 50%; background: white; border: 3px solid var(--cream-dark); display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .step-dot.done { background: var(--green); border-color: var(--green); color: white; }
    .step-dot.active { background: var(--orange); border-color: var(--orange); color: white; box-shadow: 0 0 0 4px rgba(255,107,53,.2); }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-weight: 800; font-size: 12px; }
    .status-badge.ready { background: #dbeafe; color: #1d4ed8; }
    .status-badge.pending { background: #fff3cd; color: #9a6700; }
  </style>
</head>
<body>
<nav class="navbar-etg"><div class="container d-flex align-items-center justify-content-between"><a class="logo" href="index.html">Eat<span>To</span>Go</a><div id="mainNav" class="d-none d-md-flex gap-4"></div><div id="authArea"></div></div></nav>
<section class="page-head"><div class="container"><h1>Order Status</h1></div></section>
<section class="section"><div class="container"><div class="row g-4"><div class="col-lg-8"><div class="card-etg p-4"><h3>Tracking Progress</h3><div id="trackerContainer"></div><div id="orderDetails"></div></div></div><div class="col-lg-4"><div class="card-etg p-4"><h3>Arrival Confirmation</h3><button id="arrivalBtn" class="btn btn-etg w-100">I Have Arrived</button><div id="arrivalMsg" class="mt-2 small text-muted"></div></div></div></div></div></section>
<footer class="minimal-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-5">
    <div class="footer-brand"><h2>Eat<span>To</span>Go</h2><p>Final Year Project – Restaurant and Food Reservation System.</p></div>
    <div class="footer-members"><h4>Project Team</h4><ul class="list-unstyled"><li>Navin Ramu</li><li>Muhamamd Nazim</li><li>Hadif</li><li>Ng Yue Yang</li></ul></div>
  </div>
  <div class="footer-bottom">© 2026 EatToGo • Universiti Teknologi Malaysia (UTM)</div>
</footer>
<script src="assets/js/api.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  let reservationId = urlParams.get('reservation_id');
  let currentReservation = null;
  async function getReservationId() { if(reservationId) return parseInt(reservationId); const s = await checkSession(); if(!s.loggedIn) return null; const r = await apiCall('/user-reservations.php'); if(!r.length) return null; r.sort((a,b)=>b.id-a.id); return r[0].id; }
  async function loadOrderStatus() { const rid = await getReservationId(); if(!rid) { document.getElementById('trackerContainer').innerHTML = '<p>No reservation found.</p>'; return; } try { const reservations = await apiCall('/user-reservations.php'); const r = reservations.find(rs=>rs.id==rid); if(!r) throw new Error('Not found'); currentReservation = r; const order = r.order || null; const steps = [ {label:'Reservation Submitted', desc:`Booking #${r.id} ${r.reservation_date} ${r.reservation_time}`, done:true}, {label:'Reservation Confirmed', desc:r.status==='confirmed'?'Confirmed': (r.status==='rejected'?'Rejected':'Pending'), done:r.status==='confirmed', active:r.status==='pending', rejected:r.status==='rejected'}, {label:'Pre-Order Received', desc:order?'Order placed':'No order', done:!!order, active:r.status==='confirmed'&&!order}, {label:'Being Prepared', desc:order?(order.status==='ready'?'Ready!':(order.status==='preparing'?'Preparing...':'Pending')):'-', done:order&&order.status==='ready', active:order&&(order.status==='pending'||order.status==='preparing')}, {label:'Ready – Pay at Counter', desc:order&&order.status==='ready'?'Food ready':'Not ready', done:order&&order.status==='ready'&&r.arrival_confirmed, active:order&&order.status==='ready'&&!r.arrival_confirmed}, {label:'Arrived', desc:r.arrival_confirmed?'Confirmed':'Not yet', done:r.arrival_confirmed} ]; const html = steps.map(s=>`<div class="tracker-step"><div class="step-dot ${s.rejected?'pending':s.done?'done':s.active?'active':'pending'}">${s.done?'✓':s.active?'●':'○'}</div><div><h5>${s.label}</h5><p class="text-muted">${s.desc}</p></div></div>`).join(''); document.getElementById('trackerContainer').innerHTML = html; document.getElementById('orderDetails').innerHTML = order ? `<p><b>Order total:</b> RM ${order.total_amount||0}</p>` : ''; const arrivalBtn = document.getElementById('arrivalBtn'); if(r.status!=='confirmed') { arrivalBtn.disabled=true; document.getElementById('arrivalMsg').innerText = 'Awaiting staff confirmation.'; } else if(r.arrival_confirmed) { arrivalBtn.disabled=true; document.getElementById('arrivalMsg').innerText = 'Arrival already confirmed.'; } else { arrivalBtn.disabled=false; arrivalBtn.onclick=()=>confirmArrival(rid); document.getElementById('arrivalMsg').innerText = 'Click when you arrive.'; } } catch(err) { console.error(err); document.getElementById('trackerContainer').innerHTML='<p>Error loading status.</p>'; } }
  async function confirmArrival(rid) { try { await apiCall('/arrival.php', { method:'POST', body:JSON.stringify({ reservation_id: rid }) }); alert('Arrival confirmed!'); window.location.reload(); } catch(err) { alert('Error: '+err.message); } }
  async function setupNav() { const s = await checkSession(); const navDiv = document.getElementById('mainNav'); if(!navDiv) return; const u = s.loggedIn ? s.user : null; if(!u || u.role==='customer') navDiv.innerHTML = `<a class="nav-link" href="search-results.html">Restaurants</a><a class="nav-link" href="booking-history.html">My Bookings</a><a class="nav-link" href="order-status.html">Order Status</a>`; else if(u.role==='staff') navDiv.innerHTML = `<a class="nav-link fw-bold" href="staff-dashboard.html">↗ Staff Dashboard</a>`; else if(u.role==='owner') navDiv.innerHTML = `<a class="nav-link fw-bold" href="owner-dashboard.html">↗ Owner Dashboard</a>`; else if(u.role==='admin') navDiv.innerHTML = `<a class="nav-link fw-bold" href="admin.html">↗ Admin Dashboard</a>`; }
  window.addEventListener('DOMContentLoaded', async () => { await nav(); await setupNav(); await loadOrderStatus(); });
</script>
</body>
</html>
