<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – EatToGo Staff</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .sidebar { min-height:100vh; background:#1C1208; color:white; position:fixed; width:255px; top:0; left:0; padding:22px; z-index:10; }
    .sidebar a { display:block; color:rgba(255,255,255,.72); text-decoration:none; padding:12px 14px; border-radius:14px; font-weight:700; margin:4px 0; }
    .sidebar a.active,.sidebar a:hover { background:rgba(255,107,53,.18); color:white; }
    .admin-main { margin-left:255px; min-height:100vh; background:#f4eee6; }
    .topbar { background:white; padding:18px 26px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    @media(max-width:900px){ .sidebar{position:static;width:100%;min-height:auto} .admin-main{margin-left:0} }

    .profile-avatar {
      width: 88px; height: 88px; border-radius: 50%;
      background: linear-gradient(135deg, #2D9B5A, #1a7a43);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; color: white; font-weight: 900;
      box-shadow: 0 8px 24px rgba(45,155,90,.35);
      flex-shrink: 0;
    }
    .info-row { display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0; border-bottom: 1px solid #f0e8de; }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-size: 13px; font-weight: 700; color: #9a7a5a; text-transform: uppercase; letter-spacing: .6px; }
    .info-value { font-size: 16px; font-weight: 700; color: #4A2C17; }
    .restaurant-card-profile { background: #f0faf4; border: 1.5px solid rgba(45,155,90,.22);
      border-radius: 18px; padding: 20px; }
    .copy-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 8px; transition: background .15s; }
    .copy-btn:hover { background: #e8f7ed; }
    .edit-section input { border: 2px solid #f0e8de; border-radius: 14px; padding: 11px 14px; width: 100%; font-family: inherit; font-size: 15px; }
    .edit-section input:focus { outline: none; border-color: #2D9B5A; }
    #saveMsg { display: none; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <a class="logo" href="index.html">Eat<span>To</span>Go</a>
    <hr>
    <a href="staff-dashboard.html">📋 Dashboard</a>
    <a href="staff-dashboard.html#reservations">🗓️ Reservations</a>
    <a href="staff-dashboard.html#orders">🍱 Pre-Orders</a>
    <a href="staff-dashboard.html#menu">🍽️ Menu Management</a>
    <a class="active" href="staff-profile.html">👤 My Profile</a>
    <a href="#" onclick="logout(); return false;">🚪 Sign Out</a>
  </aside>

  <main class="admin-main">
    <div class="topbar d-flex justify-content-between align-items-center">
      <h2>My Profile</h2>
      <div id="authArea"></div>
    </div>

    <div class="p-4">
      <div id="loadingState" class="text-center py-5 text-muted">Loading profile…</div>

      <div id="profileBody" style="display:none;">
        <div class="row g-4">

          <!-- LEFT: Identity Card -->
          <div class="col-lg-5">
            <div class="card-etg p-4">
              <div class="d-flex align-items-center gap-3 mb-4">
                <div class="profile-avatar" id="avatarLetter">?</div>
                <div>
                  <h4 class="mb-0" id="profileName">—</h4>
                  <span class="badge-etg mt-1" style="font-size:12px; background:rgba(45,155,90,.12); color:#2D9B5A;">👨‍🍳 Staff</span>
                </div>
              </div>

              <div class="info-row">
                <span class="info-label">Account ID</span>
                <span class="info-value d-flex align-items-center gap-1">
                  <span id="profileId">—</span>
                  <button class="copy-btn" title="Copy ID" onclick="copyText('profileId')">📋</button>
                </span>
              </div>
              <div class="info-row">
                <span class="info-label">Email</span>
                <span class="info-value d-flex align-items-center gap-1">
                  <span id="profileEmail">—</span>
                  <button class="copy-btn" title="Copy Email" onclick="copyText('profileEmail')">📋</button>
                </span>
              </div>
              <div class="info-row">
                <span class="info-label">Password</span>
                <span class="info-value d-flex align-items-center gap-1">
                  <span id="profilePassDisplay">••••••••</span>
                  <button class="copy-btn" title="Show/Hide" onclick="togglePass()">👁️</button>
                </span>
              </div>
              <div class="info-row">
                <span class="info-label">Role</span>
                <span class="info-value">👨‍🍳 Staff</span>
              </div>
              <div class="info-row">
                <span class="info-label">Member Since</span>
                <span class="info-value" id="profileJoined">—</span>
              </div>
            </div>
          </div>

          <!-- RIGHT: Assigned Restaurant + Edit -->
          <div class="col-lg-7 d-flex flex-column gap-4">

            <!-- Assigned Branch -->
            <div class="card-etg p-4">
              <h5 class="mb-3">🏬 Assigned Restaurant</h5>
              <div id="restaurantInfo">
                <p class="text-muted mb-0">Not assigned to any restaurant yet.</p>
              </div>
            </div>

            <!-- Edit Profile -->
            <div class="card-etg p-4 edit-section">
              <h5 class="mb-3">✏️ Edit Profile</h5>
              <div class="mb-3">
                <label class="info-label mb-1 d-block">Display Name</label>
                <input type="text" id="editName" placeholder="Your name">
              </div>
              <div class="mb-3">
                <label class="info-label mb-1 d-block">New Password <span class="text-muted fw-normal">(leave blank to keep current)</span></label>
                <input type="password" id="editPassword" placeholder="Enter new password">
              </div>
              <div class="d-flex align-items-center gap-3">
                <button class="btn btn-etg" style="background:linear-gradient(135deg,#2D9B5A,#1a7a43);" onclick="saveProfile()">💾 Save Changes</button>
                <span id="saveMsg" class="text-success fw-bold">✅ Saved!</span>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    async function loadProfile() {
      const session = await checkSession();
      if (!session.loggedIn || session.user.role !== 'staff') {
        alert('Unauthorized. Please login as staff.');
        window.location.href = 'login.html';
        return;
      }

      try {
        const data = await apiCall('/profile.php');

        document.getElementById('avatarLetter').textContent = (data.name || '?')[0].toUpperCase();
        document.getElementById('profileName').textContent  = data.name || '—';
        document.getElementById('profileId').textContent    = '#' + data.id;
        document.getElementById('profileEmail').textContent = data.email || '—';
        document.getElementById('profileJoined').textContent = data.created_at ? data.created_at.slice(0,10) : '—';
        document.getElementById('editName').value = data.name || '';

        // Assigned restaurant
        const container = document.getElementById('restaurantInfo');
        if (data.restaurant) {
          const r = data.restaurant;
          container.innerHTML = `
            <div class="restaurant-card-profile">
              <div class="d-flex align-items-start gap-3">
                <div style="font-size:40px; line-height:1;">🍽️</div>
                <div style="flex:1">
                  <h5 class="mb-1">${escapeHtml(r.name)}</h5>
                  <div class="d-flex flex-wrap gap-2 mb-2">
                    <span class="badge-etg" style="font-size:12px;">🍜 ${escapeHtml(r.category)}</span>
                    <span class="badge-etg" style="font-size:12px; background:rgba(45,155,90,.12); color:#2D9B5A;">📍 ${escapeHtml(r.location)}</span>
                  </div>
                  <div class="info-row" style="padding:8px 0; border-color:#d6f0e0;">
                    <span class="info-label">Restaurant ID</span>
                    <span class="info-value d-flex align-items-center gap-1">
                      <span id="restId">#${r.id}</span>
                      <button class="copy-btn" onclick="copyText('restId')">📋</button>
                    </span>
                  </div>
                  <div class="info-row" style="padding:8px 0; border:none;">
                    <span class="info-label">Restaurant Name</span>
                    <span class="info-value d-flex align-items-center gap-1">
                      <span id="restName">${escapeHtml(r.name)}</span>
                      <button class="copy-btn" onclick="copyText('restName')">📋</button>
                    </span>
                  </div>
                </div>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = '<p class="text-muted mb-0">You are not yet assigned to a restaurant. Contact your owner.</p>';
        }

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('profileBody').style.display  = 'block';
      } catch(e) {
        document.getElementById('loadingState').textContent = 'Failed to load profile.';
        console.error(e);
      }
    }

    function togglePass() {
      const el = document.getElementById('profilePassDisplay');
      el.textContent = el.textContent === '••••••••' ? '(stored securely)' : '••••••••';
    }

    function copyText(id) {
      const text = document.getElementById(id).textContent.replace('#','');
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        btn.textContent = '✅';
        setTimeout(() => btn.textContent = '📋', 1500);
      });
    }

    async function saveProfile() {
      const name     = document.getElementById('editName').value.trim();
      const password = document.getElementById('editPassword').value;
      if (!name) { alert('Name cannot be empty'); return; }
      try {
        await apiCall('/profile.php', {
          method: 'PUT',
          body: JSON.stringify({ name, password })
        });
        document.getElementById('profileName').textContent  = name;
        document.getElementById('avatarLetter').textContent = name[0].toUpperCase();
        document.getElementById('editPassword').value = '';
        const msg = document.getElementById('saveMsg');
        msg.style.display = 'inline';
        setTimeout(() => msg.style.display = 'none', 2500);
      } catch(e) { alert('Save failed: ' + e.message); }
    }

    window.addEventListener('DOMContentLoaded', async () => { await nav(); await loadProfile(); });
  </script>
</body>
</html>
