<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Booking Receipt – EatToGo</title>
</head>
<body>
<nav class="navbar-etg">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="logo" href="index.html">Eat<span>To</span>Go</a>
    <div id="mainNav" class="d-none d-md-flex gap-4"></div>
    <div id="authArea"></div>
  </div>
</nav>
<section class="page-head">
  <div class="container">
    <div class="timeline"><span>Reserve Table</span><span>Pre-Order Food</span><span>Customer Details</span><span class="active">Receipt</span><span>Pay at Counter</span></div>
    <h1 class="mt-3">Booking Receipt</h1>
    <p class="text-muted">Review your complete reservation, customer details, and itemized pre-order before payment instruction.</p>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div id="receiptBox" class="card-etg p-4 mb-4"></div>
        <div class="d-flex gap-3 justify-content-end mt-4 flex-wrap">
          <a id="editDetailsLink" href="#" class="btn btn-outline-etg">← Edit Details</a>
          <button id="goPaymentBtn" class="btn btn-etg">Continue to Payment Instruction →</button>
        </div>
      </div>
    </div>
  </div>
</section>
<footer class="minimal-footer">...</footer>
<script src="assets/js/api.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const reservationId = urlParams.get('reservation_id');
  async function loadReceipt() {
    if (!reservationId) { document.getElementById('receiptBox').innerHTML = '<p class="text-danger">Missing reservation ID.</p>'; return; }
    try {
      const reservations = await apiCall('/user-reservations.php');
      const r = reservations.find(rs => rs.id == reservationId);
      if (!r) throw new Error('Reservation not found');
      const order = r.order || null;
      let itemsHtml = '';
      let total = 0;
      if (order && order.items_summary) {
        itemsHtml = `<p><b>Pre‑ordered items:</b> ${escapeHtml(order.items_summary)}</p>`;
        total = order.total_amount || 0;
      }
      document.getElementById('receiptBox').innerHTML = `
        <h3>Booking Receipt #${r.id}</h3>
        <p><b>Restaurant:</b> ${escapeHtml(r.restaurant_name)}</p>
        <p><b>Date & Time:</b> ${r.reservation_date} ${r.reservation_time}</p>
        <p><b>Guests:</b> ${r.num_people}</p>
        <hr>
        <h5>Customer Details</h5>
        <p><b>Name:</b> ${escapeHtml(r.customer_name || '-')}<br>
           <b>Phone:</b> ${escapeHtml(r.customer_phone || '-')}<br>
           <b>Email:</b> ${escapeHtml(r.customer_email || '-')}<br>
           <b>Special requests:</b> ${escapeHtml(r.special_requests || '-')}</p>
        ${itemsHtml}
        <hr>
        <h4 class="text-end">Total: RM ${parseFloat(total).toFixed(2)}</h4>
        <div class="alert alert-warning mt-2">💵 <b>Payment:</b> Cash only – pay at counter upon arrival.</div>
      `;
      const editLink = document.getElementById('editDetailsLink');
      if (editLink) {
        editLink.href = `checkout.html?reservation_id=${reservationId}`;
      }
      document.getElementById('goPaymentBtn').onclick = () => window.location.href = `pay-counter.html?reservation_id=${reservationId}`;
    } catch (err) { console.error(err); document.getElementById('receiptBox').innerHTML = '<p class="text-danger">Error loading receipt.</p>'; }
  }
  async function setupNav() {
    const session = await checkSession();
    const navDiv = document.getElementById('mainNav');
    if (!navDiv) return;
    const u = session.loggedIn ? session.user : null;
    if (!u || u.role === 'customer') {
      navDiv.innerHTML = `<a class="nav-link" href="search-results.html">Restaurants</a><a class="nav-link" href="booking-history.html">My Bookings</a><a class="nav-link" href="order-status.html">Order Status</a>`;
    } else if (u.role === 'staff') {
      navDiv.innerHTML = `<a class="nav-link fw-bold" style="color:var(--orange)!important" href="staff-dashboard.html">↗ Go to Staff Dashboard</a>`;
    } else if (u.role === 'owner') {
      navDiv.innerHTML = `<a class="nav-link fw-bold" style="color:var(--orange)!important" href="owner-dashboard.html">↗ Go to Owner Dashboard</a>`;
    } else if (u.role === 'admin') {
      navDiv.innerHTML = `<a class="nav-link fw-bold" style="color:var(--orange)!important" href="admin.html">↗ Go to Admin Dashboard</a>`;
    }
  }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
  window.addEventListener('DOMContentLoaded', async () => {
    await nav();
    await setupNav();
    await loadReceipt();
  });
</script>
</body>
</html>
