<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Restaurant Detail – EatToGo</title>
  <style>
    .restaurant-hero-img { background: linear-gradient(135deg, #ffe1ce, #fff3e9); padding: 40px 0; text-align: center; border-radius: 24px; margin-bottom: 30px; }
    .hero-meta { display: flex; justify-content: center; gap: 20px; margin-top: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .slot { border: 2px solid var(--cream-dark); border-radius: 999px; padding: 9px 15px; background: white; font-weight: 700; transition: .2s; cursor: pointer; }
    .slot.active { background: var(--orange); border-color: var(--orange); color: white; }
    .slot:hover:not(.active):not(.text-muted) { background: rgba(255,107,53,.1); border-color: var(--orange); }
    .review-card { background: var(--cream); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .restaurant-img { max-width: 100%; height: auto; border-radius: 24px; margin-top: 20px; max-height: 300px; object-fit: cover; width: auto; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  </style>
</head>
<body>
<nav class="navbar-etg">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="logo" href="index.html">Eat<span>To</span>Go</a>
    <div class="d-none d-md-flex gap-4" id="mainNav"></div>
    <div id="authArea"></div>
  </div>
</nav>
<div id="restaurantDetail" class="container mt-4"></div>
<footer class="minimal-footer mt-5">...</footer>
<script src="assets/js/api.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const restaurantId = urlParams.get('id');
  let currentRestaurant = null;
  function formatPrice(price) { const num = parseFloat(price); return isNaN(num) ? '0.00' : num.toFixed(2); }
  async function loadRestaurantDetail() {
    const container = document.getElementById('restaurantDetail');
    if (!restaurantId) { container.innerHTML = '<div class="alert alert-danger">No restaurant specified.</div>'; return; }
    try {
      const data = await apiCall(`/restaurant-detail.php?id=${restaurantId}`);
      currentRestaurant = data.restaurant;
      const feedbacks = await apiCall(`/feedbacks.php?restaurant_id=${restaurantId}`).catch(() => []);
      renderPage(data.restaurant, data.menu, feedbacks);
    } catch (err) { console.error(err); container.innerHTML = `<div class="alert alert-danger">Failed to load restaurant details: ${err.message}</div>`; }
  }
  function renderPage(restaurant, menu, feedbacks) {
    const today = new Date().toISOString().split('T')[0];
    const reviewsHtml = feedbacks.length ? feedbacks.map(f => `<div class="review-card"><b>⭐ ${f.rating} — ${escapeHtml(f.customer_name)}</b><p>${escapeHtml(f.comment)}</p><small class="text-muted">${new Date(f.created_at).toLocaleDateString()}</small></div>`).join('') : '<p class="text-muted">No reviews yet.</p>';
    const html = `
      <div class="restaurant-hero-img">
        <div class="container">
          <span class="badge-etg">${escapeHtml(restaurant.category || 'Restaurant')} • ${escapeHtml(restaurant.location || 'Malaysia')}</span>
          <h1 class="mt-3">${escapeHtml(restaurant.name)}</h1>
          <p>${escapeHtml(restaurant.description || 'Reserve your table and pre-order food.')}</p>
          <div class="hero-meta">
            <span>⭐ ${restaurant.rating || '4.5'}</span>
            <span>📍 ${escapeHtml(restaurant.location || 'Malaysia')}</span>
            <span>💵 ${escapeHtml(restaurant.price_range || 'RM10-50')}</span>
            <span>🕒 ${escapeHtml(restaurant.hours || '10:00 AM - 10:00 PM')}</span>
          </div>
          <img src="${restaurant.image || 'assets/img/default-restaurant.jpg'}" class="restaurant-img" alt="${escapeHtml(restaurant.name)}" onerror="this.src='assets/img/default-restaurant.jpg'">
        </div>
      </div>
      <div class="row g-4 align-items-start">
        <div class="col-lg-8">
          <div class="card-etg p-4 mb-4">
            <h2>Reserve Your Table</h2>
            <p class="text-muted">Choose reservation details first.</p>
            <div class="row g-3">
              <div class="col-md-6"><label>Date</label><input id="resDate" type="date" class="form-control" value="${today}"></div>
              <div class="col-md-6"><label>Guests</label><select id="guests" class="form-select"><option>2</option><option>4</option><option>6</option><option>8</option></select></div>
            </div>
            <h5 class="mt-4">Available Time Slots</h5>
            <div class="d-flex gap-2 flex-wrap" id="slotArea">
              <button onclick="selectSlot(this)" class="slot active" data-time="7:00 PM">7:00 PM</button>
              <button onclick="selectSlot(this)" class="slot" data-time="7:30 PM">7:30 PM</button>
              <button onclick="selectSlot(this)" class="slot" data-time="8:00 PM">8:00 PM</button>
              <button class="slot text-muted" disabled>Full – 8:30 PM</button>
            </div>
            <div class="alert alert-warning mt-3">💵 Cash-only payment — pay at counter.</div>
          </div>
          <div class="card-etg p-4 mb-4">
            <h2>Menu Preview</h2>
            <div class="row g-3">
              ${menu.map(item => `<div class="col-md-6"><div class="d-flex align-items-center gap-3 p-2 border rounded-3"><span style="font-size:32px">${item.emoji || '🍽️'}</span><div><b>${escapeHtml(item.name)}</b><br><small>RM ${formatPrice(item.price)} • ${escapeHtml(item.category)}</small></div></div></div>`).join('')}
            </div>
          </div>
          <div class="card-etg p-4">
            <h2>Customer Reviews</h2>
            ${reviewsHtml}
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card-etg p-4 summary-card sticky-top" style="top:20px">
            <h3>Booking Summary</h3>
            <p><b>Restaurant:</b> ${escapeHtml(restaurant.name)}</p>
            <p><b>Selected Time:</b> <span id="selectedTime">7:00 PM</span></p>
            <button onclick="reserve()" class="btn btn-etg w-100 mb-2">Reserve Table & Pre-Order →</button>
            <a href="restaurant-detail.html?id=${restaurant.id}" class="btn btn-outline-etg w-100">View Restaurant Details</a>
          </div>
        </div>
      </div>
    `;
    document.getElementById('restaurantDetail').innerHTML = html;
  }
  function selectSlot(el) { document.querySelectorAll('.slot').forEach(s => s.classList.remove('active')); el.classList.add('active'); document.getElementById('selectedTime').innerText = el.getAttribute('data-time') || el.textContent; }
  async function reserve() {
    const session = await checkSession();
    if (!session.loggedIn || session.user.role !== 'customer') { alert('Please login as customer.'); window.location.href = 'login.html'; return; }
    const date = document.getElementById('resDate').value, time = document.getElementById('selectedTime').innerText, guests = parseInt(document.getElementById('guests').value);
    if (!date) { alert('Select a date'); return; }
    try {
      const result = await apiCall('/reservations.php', { method: 'POST', body: JSON.stringify({ restaurant_id: restaurantId, date, time, guests }) });
      if (result.id) window.location.href = `preorder.html?reservation_id=${result.id}&restaurant_id=${restaurantId}`;
      else alert('Failed to create reservation.');
    } catch(err) { alert('Error: ' + err.message); }
  }
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
  async function setupNav() { const s = await checkSession(); const navDiv = document.getElementById('mainNav'); if (!navDiv) return; const u = s.loggedIn ? s.user : null; if (!u || u.role === 'customer') navDiv.innerHTML = `<a class="nav-link" href="search-results.html">Restaurants</a><a class="nav-link" href="booking-history.html">My Bookings</a><a class="nav-link" href="order-status.html">Order Status</a>`; else if (u.role === 'staff') navDiv.innerHTML = `<a class="nav-link fw-bold" href="staff-dashboard.html">↗ Staff Dashboard</a>`; else if (u.role === 'owner') navDiv.innerHTML = `<a class="nav-link fw-bold" href="owner-dashboard.html">↗ Owner Dashboard</a>`; else if (u.role === 'admin') navDiv.innerHTML = `<a class="nav-link fw-bold" href="admin.html">↗ Admin Dashboard</a>`; }
  window.addEventListener('DOMContentLoaded', async () => { await nav(); await setupNav(); await loadRestaurantDetail(); });
</script>
</body>
</html>
