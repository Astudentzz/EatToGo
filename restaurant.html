<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Detail – EatToGo</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* Navbar layout (unchanged) */
    .navbar-etg .container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .desktop-nav {
      display: flex;
      gap: 1rem;
    }
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 28px;
      color: var(--orange);
      cursor: pointer;
      padding: 0;
    }
    @media (max-width: 768px) {
      .navbar-etg .container {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
      }
      .logo {
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
      }
      .right-group {
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hamburger {
        display: block;
        grid-column: 1;
        grid-row: 2;
        justify-self: start;
        margin-top: 4px;
      }
      .desktop-nav {
        display: none;
      }
    }
    @media (min-width: 769px) {
      .hamburger, .mobile-sidebar, .sidebar-overlay, .close-sidebar {
        display: none;
      }
    }
    .mobile-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100%;
      background: #1C1208;
      z-index: 1100;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      padding: 60px 20px 20px;
    }
    .mobile-sidebar.open {
      transform: translateX(0);
    }
    .mobile-sidebar a {
      display: block;
      color: rgba(255,255,255,.8);
      text-decoration: none;
      padding: 12px 16px;
      font-weight: 700;
      border-radius: 12px;
      margin: 8px 0;
    }
    .mobile-sidebar a:hover, .mobile-sidebar a.active {
      background: rgba(255,107,53,.2);
      color: var(--orange);
    }
    .close-sidebar {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1050;
      display: none;
    }
    .sidebar-overlay.active {
      display: block;
    }

    /* Restaurant page specific styles */
    .restaurant-hero {
      position: relative;
      background-size: cover;
      background-position: center;
      border-radius: 24px;
      margin-bottom: 30px;
      overflow: hidden;
    }
    .restaurant-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      padding: 60px 30px;
      color: white;
      text-align: left;
    }
    .hero-content .badge-etg {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      color: white;
      border: none;
    }
    .hero-meta {
      display: flex;
      justify-content: flex-start;
      gap: 20px;
      margin-top: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .hero-meta span {
      background: rgba(0,0,0,0.5);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
    }
    .slot {
      border: 2px solid var(--cream-dark);
      border-radius: 999px;
      padding: 9px 15px;
      background: white;
      font-weight: 700;
      transition: .2s;
      cursor: pointer;
    }
    .slot.active {
      background: var(--orange);
      border-color: var(--orange);
      color: white;
    }
    .review-card {
      background: var(--cream);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .menu-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
    }
    .summary-card {
      position: sticky;
      top: 90px;
    }
    @media (max-width: 768px) {
      .hero-content {
        padding: 40px 20px;
        text-align: center;
      }
      .hero-meta {
        justify-content: center;
      }
      .slot { padding: 6px 12px; font-size: 14px; }
      .summary-card {
        position: static;
        margin-top: 1.5rem;
      }
      .menu-img { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>

<nav class="navbar-etg">
  <div class="container">
    <a class="logo" href="index.html">Eat<span>To</span>Go</a>
    <div class="desktop-nav" id="mainNav"></div>
    <div class="right-group">
      <div id="authArea"></div>
    </div>
    <button class="hamburger" id="hamburgerBtn">☰</button>
  </div>
</nav>

<div class="mobile-sidebar" id="mobileSidebar">
  <button class="close-sidebar" id="closeSidebarBtn">×</button>
  <div id="mobileNavLinks"></div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div id="restaurantDetail" class="container mt-4"></div>

<footer class="minimal-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-5">
    <div class="footer-brand"><h2>Eat<span>To</span>Go</h2><p>Final Year Project – Restaurant and Food Reservation System.</p></div>
    <div class="footer-members"><h4>Project Team</h4><ul class="list-unstyled"><li>Navin Ramu</li><li>Muhamamd Nazim</li><li>Hadif</li><li>Ng Yue Yang</li></ul></div>
  </div>
  <div class="footer-bottom">© 2026 EatToGo • Universiti Teknologi Malaysia (UTM)</div>
</footer>

<script src="assets/js/api.js"></script>
<script>
  // Sidebar toggle
  const hamburger = document.getElementById('hamburgerBtn');
  const sidebar = document.getElementById('mobileSidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const closeBtn = document.getElementById('closeSidebarBtn');
  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
  if (hamburger) hamburger.addEventListener('click', openSidebar);
  if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if (overlay) overlay.addEventListener('click', closeSidebar);

  const urlParams = new URLSearchParams(window.location.search);
  const restaurantId = urlParams.get('id');
  let currentRestaurant = null;
  function formatPrice(price) { const num = parseFloat(price); return isNaN(num) ? '0.00' : num.toFixed(2); }
  const defaultMenuSvg = "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23ddd%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2255%22%20font-size%3D%2212%22%20text-anchor%3D%22middle%22%20fill%3D%22%23666%22%3ENo%20Img%3C%2Ftext%3E%3C%2Fsvg%3E";

  async function loadRestaurantDetail() {
    const container = document.getElementById('restaurantDetail');
    if (!restaurantId) { container.innerHTML = '<div class="alert alert-danger">No restaurant specified.</div>'; return; }
    try {
      const data = await apiCall(`/restaurant-detail.php?id=${restaurantId}`);
      currentRestaurant = data.restaurant;
      const feedbacks = await apiCall(`/feedbacks.php?restaurant_id=${restaurantId}`).catch(() => []);
      renderPage(data.restaurant, data.menu, feedbacks);
    } catch (err) { console.error(err); container.innerHTML = `<div class="alert alert-danger">Failed to load restaurant details: ${err.message}</div>`; }
  }

  async function loadTimeSlots(date) {
    if (!date || !restaurantId) return [];
    try {
      const slots = await apiCall(`/restaurant-timeslots.php?restaurant_id=${restaurantId}&date=${date}`);
      return slots;
    } catch(e) {
      console.error(e);
      return [];
    }
  }

  async function renderTimeSlots(date) {
    const slotArea = document.getElementById('slotArea');
    if (!slotArea) return;
    const slots = await loadTimeSlots(date);
    if (slots.length === 0) {
      slotArea.innerHTML = '<p class="text-muted">No available time slots for this date.</p>';
      return;
    }
    slotArea.innerHTML = slots.map(slot => `
      <button onclick="selectSlot(this)" class="slot" data-time="${slot.time}" data-available="${slot.available}">
        ${slot.time} (${slot.available} seats)
      </button>
    `).join('');
    const firstSlot = document.querySelector('.slot');
    if (firstSlot) selectSlot(firstSlot);
  }

  function selectSlot(el) {
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('selectedTime').innerText = el.getAttribute('data-time');
    document.getElementById('selectedAvailable').innerText = el.getAttribute('data-available');
    checkAvailability();
  }

  async function checkAvailability() {
    const date = document.getElementById('resDate')?.value;
    const time = document.getElementById('selectedTime')?.innerText;
    if (!date || !time || !restaurantId) return;
    try {
      const data = await apiCall(`/check-availability.php?restaurant_id=${restaurantId}&date=${date}&time=${encodeURIComponent(time)}`);
      const available = data.available;
      const totalSeats = data.total;
      const msgEl = document.getElementById('availabilityMsg');
      const guestsInput = document.getElementById('guests');
      if (msgEl) {
        if (available <= 0) {
          msgEl.innerHTML = `<span class="text-danger">❌ Fully booked for ${time}. Please choose another time.</span>`;
        } else {
          msgEl.innerHTML = `✅ ${available} of ${totalSeats} seats available for ${time}`;
        }
      }
      if (guestsInput) {
        const maxGuests = Math.min(available, 20);
        guestsInput.max = maxGuests;
        if (parseInt(guestsInput.value) > maxGuests) {
          guestsInput.value = maxGuests;
        }
      }
    } catch(e) { console.error(e); }
  }

  // Helper to compute average rating from feedbacks array
  function getAverageRating(feedbacks) {
    if (!feedbacks || feedbacks.length === 0) return null;
    const sum = feedbacks.reduce((acc, f) => acc + f.rating, 0);
    const avg = sum / feedbacks.length;
    return avg.toFixed(1);
  }

  function renderPage(restaurant, menu, feedbacks) {
    const today = new Date().toISOString().split('T')[0];
    const avgRating = getAverageRating(feedbacks);
    const reviewCount = feedbacks.length;
    let ratingDisplay = '';
    if (avgRating === null) {
      ratingDisplay = '⭐ No reviews yet';
    } else {
      ratingDisplay = `⭐ ${avgRating} (${reviewCount} review${reviewCount !== 1 ? 's' : ''})`;
    }

    const reviewsHtml = feedbacks.length ? feedbacks.map(f => `<div class="review-card"><b>⭐ ${f.rating} — ${escapeHtml(f.customer_name)}</b><p>${escapeHtml(f.comment)}</p><small>${new Date(f.created_at).toLocaleDateString()}</small></div>`).join('') : '<p class="text-muted">No reviews yet.</p>';
    
    // Hero background image
    const bgImage = restaurant.image || 'assets/img/default-restaurant.jpg';
    
    const html = `
      <div class="restaurant-hero" style="background-image: url('${bgImage}');">
        <div class="hero-content">
          <span class="badge-etg">${escapeHtml(restaurant.category || 'Restaurant')} • ${escapeHtml(restaurant.location || 'Malaysia')}</span>
          <h1 class="mt-3">${escapeHtml(restaurant.name)}</h1>
          <p>${escapeHtml(restaurant.description || 'Reserve your table and pre-order food.')}</p>
          <div class="hero-meta">
            <span>${ratingDisplay}</span>
            <span>📍 ${escapeHtml(restaurant.location || 'Malaysia')}</span>
            <span>💵 ${escapeHtml(restaurant.price_range || 'RM10-50')}</span>
            <span>🕒 ${escapeHtml(restaurant.hours || '10:00 AM - 10:00 PM')}</span>
          </div>
        </div>
      </div>
      <div class="row g-4 align-items-start">
        <div class="col-lg-8">
          <div class="card-etg p-4 mb-4">
            <h2>Reserve Your Table</h2>
            <div class="row g-3">
              <div class="col-md-6">
                <label>Date</label>
                <input id="resDate" type="date" class="form-control" value="${today}" onchange="renderTimeSlots(this.value)">
              </div>
              <div class="col-md-6">
                <label>Guests</label>
                <input type="number" id="guests" class="form-control" min="1" max="20" value="2" onchange="checkAvailability()">
                <small id="availabilityMsg" class="text-muted d-block mt-1"></small>
              </div>
            </div>
            <h5 class="mt-4">Available Time Slots</h5>
            <div class="d-flex gap-2 flex-wrap" id="slotArea"></div>
          </div>
          <div class="card-etg p-4 mb-4">
            <h2>Menu Preview</h2>
            <div class="row g-3">
              ${menu.map(item => `
                <div class="col-md-6">
                  <div class="d-flex align-items-center gap-3 p-2 border rounded-3">
                    ${item.image ? `<img src="${item.image}" class="menu-img" onerror="this.src='${defaultMenuSvg}'">` : `<span style="font-size:32px">${item.emoji || '🍽️'}</span>`}
                    <div><b>${escapeHtml(item.name)}</b><br><small class="text-muted">RM ${formatPrice(item.price)} • ${escapeHtml(item.category)}</small></div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="card-etg p-4">
            <h2>Customer Reviews</h2>
            ${reviewsHtml}
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card-etg p-4 summary-card">
            <h3>Booking Summary</h3>
            <p><b>Restaurant:</b> ${escapeHtml(restaurant.name)}</p>
            <p><b>Selected Time:</b> <span id="selectedTime">7:00 PM</span></p>
            <p><b>Available Seats:</b> <span id="selectedAvailable">0</span></p>
            <p><b>Total Seats:</b> ${restaurant.total_seats || 'N/A'}</p>
            <button onclick="reserve()" class="btn btn-etg w-100 mb-2">Reserve Table & Pre-Order →</button>
            <a href="restaurant-detail.html?id=${restaurant.id}" class="btn btn-outline-etg w-100">View Restaurant Details</a>
          </div>
        </div>
      </div>
    `;
    document.getElementById('restaurantDetail').innerHTML = html;
    renderTimeSlots(today);
  }

  async function reserve() {
    const session = await checkSession();
    if (!session.loggedIn || session.user.role !== 'customer') { 
        alert('Please login as customer.'); 
        window.location.href = 'login.html'; 
        return; 
    }
    const date = document.getElementById('resDate').value;
    const time = document.getElementById('selectedTime').innerText;
    const guests = parseInt(document.getElementById('guests').value);
    if (!date) { alert('Select a date'); return; }
    if (isNaN(guests) || guests < 1) { alert('Please enter a valid number of guests.'); return; }
    const availableSpan = document.getElementById('selectedAvailable');
    const maxGuests = parseInt(availableSpan.innerText);
    if (!isNaN(maxGuests) && guests > maxGuests) {
      alert(`Only ${maxGuests} seat(s) available for this time slot. Please reduce the number of guests.`);
      return;
    }
    try {
      const result = await apiCall('/reservations.php', { 
          method: 'POST', 
          body: JSON.stringify({ restaurant_id: restaurantId, date, time, guests }) 
      });
      if (result.id) {
          window.location.href = `preorder.html?reservation_id=${result.id}&restaurant_id=${restaurantId}`;
      } else {
          alert('Failed to create reservation.');
      }
    } catch(err) {
      // Handle duplicate reservation error (409 Conflict)
      if (err.message && err.message.includes('already have a reservation')) {
          alert('You have already booked this restaurant for the same date and time. Please choose a different time slot or date.');
      } else {
          alert('Error: ' + err.message);
      }
    }
  }

  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

  async function setupNav() {
    const s = await checkSession();
    const desktopNav = document.getElementById('mainNav');
    const mobileNav = document.getElementById('mobileNavLinks');
    if (!desktopNav) return;
    const u = s.loggedIn ? s.user : null;
    let navHtml = '';
    if (!u || u.role === 'customer') {
      navHtml = `<a class="nav-link" href="index.html">Restaurants</a>
                 <a class="nav-link" href="booking-history.html">My Bookings</a>
                 <a class="nav-link" href="order-status.html">Order Status</a>`;
    } else if (u.role === 'staff') {
      navHtml = `<a class="nav-link fw-bold" href="staff-dashboard.html">↗ Staff Dashboard</a>`;
    } else if (u.role === 'owner') {
      navHtml = `<a class="nav-link fw-bold" href="owner-dashboard.html">↗ Owner Dashboard</a>`;
    } else if (u.role === 'admin') {
      navHtml = `<a class="nav-link fw-bold" href="admin.html">↗ Admin Dashboard</a>`;
    }
    desktopNav.innerHTML = navHtml;
    if (mobileNav) mobileNav.innerHTML = navHtml;
  }

  window.addEventListener('DOMContentLoaded', async () => {
    await nav();
    await setupNav();
    await loadRestaurantDetail();
  });
</script>
</body>
</html>
