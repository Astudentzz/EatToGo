<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Details – EatToGo</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* Same navbar styles as in restaurant.html (copy the entire navbar CSS block from index.html) */
    .navbar-etg .container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .desktop-nav {
      display: flex;
      gap: 1rem;
    }
    .hamburger {
      display: none;
      background: none;
      border: none;
      font-size: 28px;
      color: var(--orange);
      cursor: pointer;
      padding: 0;
    }
    @media (max-width: 768px) {
      .navbar-etg .container {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
      }
      .logo {
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
      }
      .right-group {
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hamburger {
        display: block;
        grid-column: 1;
        grid-row: 2;
        justify-self: start;
        margin-top: 4px;
      }
      .desktop-nav {
        display: none;
      }
    }
    @media (min-width: 769px) {
      .hamburger, .mobile-sidebar, .sidebar-overlay, .close-sidebar {
        display: none;
      }
    }
    .mobile-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100%;
      background: #1C1208;
      z-index: 1100;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      padding: 60px 20px 20px;
    }
    .mobile-sidebar.open {
      transform: translateX(0);
    }
    .mobile-sidebar a {
      display: block;
      color: rgba(255,255,255,.8);
      text-decoration: none;
      padding: 12px 16px;
      font-weight: 700;
      border-radius: 12px;
      margin: 8px 0;
    }
    .mobile-sidebar a:hover, .mobile-sidebar a.active {
      background: rgba(255,107,53,.2);
      color: var(--orange);
    }
    .close-sidebar {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1050;
      display: none;
    }
    .sidebar-overlay.active {
      display: block;
    }

    .restaurant-hero-img { background: linear-gradient(135deg, #ffe1ce, #fff3e9); padding: 60px 0; text-align: center; border-radius: 24px; margin-bottom: 30px; overflow: auto; }
    .hero-meta { display: flex; justify-content: center; gap: 20px; margin-top: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 16px; margin: 30px 0; }
    .gallery-grid div { background: white; border-radius: 16px; text-align: center; padding: 20px; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    .review-card { background: var(--cream); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .restaurant-img { max-width: 100%; height: auto; border-radius: 24px; margin-bottom: 20px; max-height: 300px; object-fit: cover; margin-top: 20px; }
    .menu-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }
    @media (max-width: 768px) {
      .restaurant-hero-img { padding: 30px 0; }
      .restaurant-img { max-height: 200px; }
      .menu-thumb { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>

<nav class="navbar-etg">
  <div class="container">
    <a class="logo" href="index.html">Eat<span>To</span>Go</a>
    <div class="desktop-nav" id="mainNav"></div>
    <div class="right-group">
      <div id="authArea"></div>
    </div>
    <button class="hamburger" id="hamburgerBtn">☰</button>
  </div>
</nav>

<div class="mobile-sidebar" id="mobileSidebar">
  <button class="close-sidebar" id="closeSidebarBtn">×</button>
  <div id="mobileNavLinks"></div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div id="restaurantInfoPage" class="container mt-4"></div>

<footer class="minimal-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-5">
    <div class="footer-brand"><h2>Eat<span>To</span>Go</h2><p>Final Year Project – Restaurant and Food Reservation System.</p></div>
    <div class="footer-members"><h4>Project Team</h4><ul class="list-unstyled"><li>Navin Ramu</li><li>Muhamamd Nazim</li><li>Hadif</li><li>Ng Yue Yang</li></ul></div>
  </div>
  <div class="footer-bottom">© 2026 EatToGo • Universiti Teknologi Malaysia (UTM)</div>
</footer>

<script src="assets/js/api.js"></script>
<script>
  // Sidebar toggle
  const hamburger = document.getElementById('hamburgerBtn');
  const sidebar = document.getElementById('mobileSidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const closeBtn = document.getElementById('closeSidebarBtn');
  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
  if (hamburger) hamburger.addEventListener('click', openSidebar);
  if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if (overlay) overlay.addEventListener('click', closeSidebar);

  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
  const defaultMenuSvg = "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23ddd%22%2F%3E%3Ctext%20x%3D%2250%22%20y%3D%2255%22%20font-size%3D%2212%22%20text-anchor%3D%22middle%22%20fill%3D%22%23666%22%3ENo%20Img%3C%2Ftext%3E%3C%2Fsvg%3E";
  async function loadRestaurantDetails() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    if (!id) { document.getElementById('restaurantInfoPage').innerHTML = '<div class="alert alert-danger">No restaurant ID provided.</div>'; return; }
    try {
      const data = await apiCall(`/restaurant-detail.php?id=${id}`);
      const restaurant = data.restaurant;
      const menu = data.menu;
      let feedbacks = [];
      try { feedbacks = await apiCall(`/feedbacks.php?restaurant_id=${id}`); } catch(e) { console.warn(e); }
      const reviewsHtml = feedbacks.length ? feedbacks.map(f => `<div class="review-card"><b>⭐ ${f.rating} — ${escapeHtml(f.customer_name)}</b><p>${escapeHtml(f.comment)}</p><small>${new Date(f.created_at).toLocaleDateString()}</small></div>`).join('') : '<p class="text-muted">No reviews yet.</p>';
      const html = `
        <div class="restaurant-hero-img">
          <div class="container">
            <span class="badge-etg">${escapeHtml(restaurant.category || 'Restaurant')} • ${escapeHtml(restaurant.location || 'Malaysia')}</span>
            <h1 class="mt-3">${escapeHtml(restaurant.name)}</h1>
            <p>${escapeHtml(restaurant.description || 'Discover our delicious menu.')}</p>
            <div class="hero-meta">
              <span>⭐ ${restaurant.rating || '4.5'}</span>
              <span>📍 ${escapeHtml(restaurant.location || 'Malaysia')}</span>
              <span>💵 ${escapeHtml(restaurant.price_range || 'RM10-50')}</span>
              <span>🕒 ${escapeHtml(restaurant.hours || '10:00 AM - 10:00 PM')}</span>
            </div>
            <img src="${restaurant.image || 'assets/img/default-restaurant.jpg'}" class="restaurant-img" alt="${escapeHtml(restaurant.name)}" onerror="this.src='assets/img/default-restaurant.jpg'">
          </div>
        </div>
        <div class="row g-4 align-items-start">
          <div class="col-lg-8">
            <div class="card-etg p-4 mb-4"><h2>About ${escapeHtml(restaurant.name)}</h2><p>${escapeHtml(restaurant.description || 'We offer authentic cuisine.')}</p><p class="text-muted">Promotion: <b>${escapeHtml(restaurant.deal || 'Special combo deals')}</b></p></div>
            <div class="gallery-grid mb-4"><div>🍽️<br><small>Main Dining</small></div><div>🍣<br><small>Specials</small></div><div>🪑<br><small>Seating</small></div><div>📸<br><small>Gallery</small></div></div>
            <div class="card-etg p-4 mb-4"><h2>Menu Highlights</h2><div class="row g-3">
              ${menu.slice(0,4).map(item => `
                <div class="col-md-6">
                  <div class="d-flex align-items-center gap-3 p-2 border rounded-3">
                    <img src="${item.image || defaultMenuSvg}" class="menu-thumb" onerror="this.src='${defaultMenuSvg}'">
                    <div><b>${escapeHtml(item.name)}</b><br><small class="text-muted">RM ${parseFloat(item.price).toFixed(2)} • ${escapeHtml(item.category)}</small></div>
                  </div>
                </div>
              `).join('')}
            </div></div>
            <div class="card-etg p-4"><h2>Customer Reviews</h2>${reviewsHtml}</div>
          </div>
          <div class="col-lg-4"><div class="card-etg p-4 summary-card sticky-top"><h3>Restaurant Info</h3><p><b>Cuisine:</b> ${escapeHtml(restaurant.category || '-')}</p><p><b>Location:</b> ${escapeHtml(restaurant.location || '-')}</p><p><b>Hours:</b> ${escapeHtml(restaurant.hours || '10:00 AM - 10:00 PM')}</p><p><b>Price Range:</b> ${escapeHtml(restaurant.price_range || '-')}</p><p><b>Promotion:</b> ${escapeHtml(restaurant.deal || 'Check latest deals')}</p><p><b>Total Seats:</b> ${restaurant.total_seats || 'N/A'}</p><hr><a class="btn btn-etg w-100" href="restaurant.html?id=${restaurant.id}">Reserve a Table →</a><a class="btn btn-outline-etg w-100 mt-2" href="index.html">← Browse All</a></div></div>
        </div>
      `;
      document.getElementById('restaurantInfoPage').innerHTML = html;
    } catch(err) { document.getElementById('restaurantInfoPage').innerHTML = '<div class="alert alert-danger">Failed to load.</div>'; }
  }

  async function setupNav() {
    const s = await checkSession();
    const desktopNav = document.getElementById('mainNav');
    const mobileNav = document.getElementById('mobileNavLinks');
    if (!desktopNav) return;
    const u = s.loggedIn ? s.user : null;
    let navHtml = '';
    if (!u || u.role === 'customer') {
      navHtml = `<a class="nav-link" href="index.html">Restaurants</a>
                 <a class="nav-link" href="booking-history.html">My Bookings</a>
                 <a class="nav-link" href="order-status.html">Order Status</a>`;
    } else if (u.role === 'staff') {
      navHtml = `<a class="nav-link fw-bold" href="staff-dashboard.html">↗ Staff Dashboard</a>`;
    } else if (u.role === 'owner') {
      navHtml = `<a class="nav-link fw-bold" href="owner-dashboard.html">↗ Owner Dashboard</a>`;
    } else if (u.role === 'admin') {
      navHtml = `<a class="nav-link fw-bold" href="admin.html">↗ Admin Dashboard</a>`;
    }
    desktopNav.innerHTML = navHtml;
    if (mobileNav) mobileNav.innerHTML = navHtml;
  }

  window.addEventListener('DOMContentLoaded', async () => {
    await nav();
    await setupNav();
    await loadRestaurantDetails();
  });
</script>
</body>
</html>
