<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Restaurant Details – EatToGo</title>
  <style>
    .restaurant-hero-img { background: linear-gradient(135deg, #ffe1ce, #fff3e9); padding: 60px 0; text-align: center; border-radius: 24px; margin-bottom: 30px; }
    .hero-meta { display: flex; justify-content: center; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 16px; margin: 30px 0; }
    .gallery-grid div { background: white; border-radius: 16px; text-align: center; padding: 20px; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    .review-card { background: var(--cream); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .restaurant-img { max-width: 100%; height: auto; border-radius: 24px; margin-bottom: 20px; max-height: 300px; object-fit: cover; }
  </style>
</head>
<body>
<nav class="navbar-etg">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="logo" href="index.html">Eat<span>To</span>Go</a>
    <div class="d-none d-md-flex gap-4" id="mainNav"></div>
    <div id="authArea"></div>
  </div>
</nav>
<div id="restaurantInfoPage" class="container mt-4"></div>
<footer class="minimal-footer mt-5">...</footer>
<script src="assets/js/api.js"></script>
<script>
  function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
  async function loadRestaurantDetails() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    if (!id) { document.getElementById('restaurantInfoPage').innerHTML = '<div class="alert alert-danger">No restaurant ID provided.</div>'; return; }
    try {
      const data = await apiCall(`/restaurant-detail.php?id=${id}`);
      const restaurant = data.restaurant;
      const menu = data.menu;
      let feedbacks = [];
      try { feedbacks = await apiCall(`/feedbacks.php?restaurant_id=${id}`); } catch(e) { console.warn(e); }
      const reviewsHtml = feedbacks.length ? feedbacks.map(f => `<div class="review-card"><b>⭐ ${f.rating} — ${escapeHtml(f.customer_name)}</b><p>${escapeHtml(f.comment)}</p><small>${new Date(f.created_at).toLocaleDateString()}</small></div>`).join('') : '<p class="text-muted">No reviews yet.</p>';
      const html = `
        <div class="restaurant-hero-img"><div class="container">
          <img src="${restaurant.image || 'assets/img/default-restaurant.jpg'}" class="restaurant-img" onerror="this.src='assets/img/default-restaurant.jpg'">
          <span class="badge-etg">${escapeHtml(restaurant.category || 'Restaurant')} • ${escapeHtml(restaurant.location || 'Malaysia')}</span>
          <h1 class="mt-3">${escapeHtml(restaurant.name)}</h1>
          <p>${escapeHtml(restaurant.description || 'Discover our delicious menu.')}</p>
          <div class="hero-meta"><span>⭐ ${restaurant.rating || '4.5'}</span><span>📍 ${escapeHtml(restaurant.location || 'Malaysia')}</span><span>💵 ${escapeHtml(restaurant.price_range || 'RM10-50')}</span><span>🕒 ${escapeHtml(restaurant.hours || '10:00 AM - 10:00 PM')}</span></div>
        </div></div>
        <div class="row g-4 align-items-start">
          <div class="col-lg-8">
            <div class="card-etg p-4 mb-4"><h2>About ${escapeHtml(restaurant.name)}</h2><p>${escapeHtml(restaurant.description || 'We offer authentic cuisine.')}</p><p class="text-muted">Promotion: <b>${escapeHtml(restaurant.deal || 'Special combo deals')}</b></p></div>
            <div class="gallery-grid mb-4"><div>🍽️<br><small>Main Dining</small></div><div>🍣<br><small>Specials</small></div><div>🪑<br><small>Seating</small></div><div>📸<br><small>Gallery</small></div></div>
            <div class="card-etg p-4 mb-4"><h2>Menu Highlights</h2><div class="row g-3">${menu.slice(0,4).map(item => `<div class="col-md-6"><div class="d-flex align-items-center gap-3 p-2 border rounded-3"><span style="font-size:32px">${item.emoji || '🍽️'}</span><div><b>${escapeHtml(item.name)}</b><br><small>RM ${parseFloat(item.price).toFixed(2)} • ${escapeHtml(item.category)}</small></div></div></div>`).join('')}</div></div>
            <div class="card-etg p-4"><h2>Customer Reviews</h2>${reviewsHtml}</div>
          </div>
          <div class="col-lg-4"><div class="card-etg p-4 summary-card sticky-top"><h3>Restaurant Info</h3><p><b>Cuisine:</b> ${escapeHtml(restaurant.category || '-')}</p><p><b>Location:</b> ${escapeHtml(restaurant.location || '-')}</p><p><b>Hours:</b> ${escapeHtml(restaurant.hours || '10:00 AM - 10:00 PM')}</p><p><b>Price Range:</b> ${escapeHtml(restaurant.price_range || '-')}</p><p><b>Promotion:</b> ${escapeHtml(restaurant.deal || 'Check latest deals')}</p><hr><a class="btn btn-etg w-100" href="restaurant.html?id=${restaurant.id}">Reserve a Table →</a><a class="btn btn-outline-etg w-100 mt-2" href="search-results.html">← Browse All</a></div></div>
        </div>
      `;
      document.getElementById('restaurantInfoPage').innerHTML = html;
    } catch(err) { document.getElementById('restaurantInfoPage').innerHTML = '<div class="alert alert-danger">Failed to load.</div>'; }
  }
  async function setupNav() { const s = await checkSession(); const navDiv = document.getElementById('mainNav'); if (!navDiv) return; const u = s.loggedIn ? s.user : null; if (!u || u.role === 'customer') navDiv.innerHTML = `<a class="nav-link" href="search-results.html">Restaurants</a><a class="nav-link" href="booking-history.html">My Bookings</a><a class="nav-link" href="order-status.html">Order Status</a>`; else if (u.role === 'staff') navDiv.innerHTML = `<a class="nav-link fw-bold" href="staff-dashboard.html">↗ Staff Dashboard</a>`; else if (u.role === 'owner') navDiv.innerHTML = `<a class="nav-link fw-bold" href="owner-dashboard.html">↗ Owner Dashboard</a>`; else if (u.role === 'admin') navDiv.innerHTML = `<a class="nav-link fw-bold" href="admin.html">↗ Admin Dashboard</a>`; }
  window.addEventListener('DOMContentLoaded', async () => { await nav(); await setupNav(); await loadRestaurantDetails(); });
</script>
</body>
</html>
