<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Sign In – EatToGo</title>
  <style>
    /* Toast notification */
    .etg-toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: #1C1208; color: white; border-radius: 16px;
      padding: 14px 24px; font-weight: 700; font-size: 15px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
      opacity: 0; transition: all .35s cubic-bezier(.34,1.56,.64,1);
      z-index: 9999; min-width: 300px; max-width: 90vw; pointer-events: none;
    }
    .etg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .etg-toast.error  { border-left: 5px solid #ef4444; }
    .etg-toast.success { border-left: 5px solid var(--green); }
    .etg-toast.warning { border-left: 5px solid var(--orange); }
    .toast-icon { font-size: 20px; }
    .shake { animation: shake .4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
  </style>
</head>
<body>

<!-- Toast -->
<div class="etg-toast" id="etgToast">
  <span class="toast-icon" id="toastIcon">⚠️</span>
  <span id="toastMsg">Message here</span>
</div>

<div class="auth-wrap">
  <div class="container">
    <form onsubmit="doLogin(event)" class="auth-card card-etg" id="loginForm">
      <a class="logo" href="index.html">Eat<span>To</span>Go</a>
      <h1 class="mt-4">Sign In</h1>
      <p class="text-muted">Welcome back! Enter your registered email.</p>

      <label class="fw-bold mb-1">Email</label>
      <input id="email" class="form-control mb-3" type="email" placeholder="your@email.com" required>

      <label class="fw-bold mb-1">Password</label>
      <input id="password" class="form-control mb-3" type="password" placeholder="Password" required>

      <label class="fw-bold mb-1">Sign in as</label>
      <select id="role" class="form-select mb-4">
        <option value="customer">Customer</option>
        <option value="staff">Restaurant Staff</option>
        <option value="owner">Restaurant Owner</option>
        <option value="admin">Admin</option>
      </select>

      <button class="btn btn-etg w-100" type="submit">Sign In</button>

      <div class="mt-3 d-flex justify-content-between">
        <a href="signup.html">Create account</a>
        <a href="forgot-password.html">Forgot password?</a>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script>
let toastTimer;
function showToast(msg, type = 'error', icon = '⚠️') {
  const t = document.getElementById('etgToast');
  const m = document.getElementById('toastMsg');
  const i = document.getElementById('toastIcon');
  t.className = `etg-toast ${type}`;
  m.textContent = msg;
  i.textContent = icon;
  clearTimeout(toastTimer);
  // Force reflow so re-showing works
  void t.offsetWidth;
  t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
}

function doLogin(e) {
  e.preventDefault();
  const email  = document.getElementById('email').value.trim().toLowerCase();
  const role   = document.getElementById('role').value;
  const users  = get('users', []);

  // Check if email is registered
  const match = users.find(u => u.email.toLowerCase() === email);

  if (!match) {
    // Not registered — shake form and show toast
    const form = document.getElementById('loginForm');
    form.classList.remove('shake');
    void form.offsetWidth;
    form.classList.add('shake');
    showToast('No account found with that email. Please sign up first.', 'error', '❌');
    return;
  }

  // Email found — check role matches
  if (match.role !== role) {
    const form = document.getElementById('loginForm');
    form.classList.remove('shake');
    void form.offsetWidth;
    form.classList.add('shake');
    showToast(`This email is registered as "${match.role}", not "${role}". Please select the correct role.`, 'warning', '⚠️');
    return;
  }

  // All good — log in
  showToast(`Welcome back, ${match.name}!`, 'success', '✅');
  set('session', match);
  setTimeout(() => {
    const redirect = get('redirectAfterLogin', null);
    localStorage.removeItem('redirectAfterLogin');
    if (redirect && role === 'customer') { location.href = redirect; return; }
    if (role === 'admin')  { location.href = 'admin.html'; return; }
    if (role === 'staff')  { location.href = 'staff-dashboard.html'; return; }
    if (role === 'owner')  { location.href = 'owner-dashboard.html'; return; }
    location.href = 'index.html';
  }, 900);
}
</script>
</body>
</html>
