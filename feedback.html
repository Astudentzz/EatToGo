<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Feedback – EatToGo</title>
  <style>.etg-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1C1208; color: white; border-radius: 16px; padding: 14px 24px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); opacity: 0; transition: all .35s; z-index: 9999; min-width: 300px; pointer-events: none; } .etg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); } .etg-toast.error { border-left: 5px solid #ef4444; } .etg-toast.success { border-left: 5px solid var(--green); } .etg-toast.warning { border-left: 5px solid var(--orange); }</style>
</head>
<body>
<div class="etg-toast" id="etgToast"><span class="toast-icon" id="toastIcon">⚠️</span><span id="toastMsg">Message here</span></div>
<nav class="navbar-etg"><div class="container d-flex align-items-center justify-content-between"><a class="logo" href="index.html">Eat<span>To</span>Go</a><div id="mainNav" class="d-none d-md-flex gap-4"></div><div id="authArea"></div></div></nav>
<section class="section"><div class="container"><form id="feedbackForm" class="card-etg p-5 mx-auto" style="max-width:680px"><h1>Dining Feedback</h1><label>Rating</label><select id="rating" class="form-select mb-3" required><option value="5">5 – Excellent</option><option value="4">4 – Very Good</option><option value="3">3 – Good</option><option value="2">2 – Fair</option><option value="1">1 – Poor</option></select><label>Your Feedback</label><textarea id="comment" class="form-control mb-3" rows="5" required></textarea><button type="submit" class="btn btn-etg w-100">Submit</button></form></div></section>
<footer class="minimal-footer">...</footer>
<script src="assets/js/api.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const reservationId = urlParams.get('reservation_id');
  let toastTimer;
  function showToast(msg, type='success', icon='✅') { const t=document.getElementById('etgToast'); t.className=`etg-toast ${type}`; document.getElementById('toastMsg').textContent=msg; document.getElementById('toastIcon').textContent=icon; clearTimeout(toastTimer); void t.offsetWidth; t.classList.add('show'); toastTimer=setTimeout(()=>t.classList.remove('show'),3800); }
  async function verifyAccess() { const session = await checkSession(); if(!session.loggedIn || session.user.role !== 'customer') { showToast('Please login as customer.','warning'); setTimeout(()=>window.location.href='login.html',1500); return false; } if(!reservationId) { showToast('No reservation ID.','error'); setTimeout(()=>window.location.href='booking-history.html',1500); return false; } try { const reservations = await apiCall('/user-reservations.php'); const valid = reservations.some(r=>r.id==reservationId); if(!valid) throw new Error(); return true; } catch(e) { showToast('Unauthorized.','error'); setTimeout(()=>window.location.href='booking-history.html',1500); return false; } }
  async function submitFeedback(e) { e.preventDefault(); const rating = document.getElementById('rating').value; const comment = document.getElementById('comment').value.trim(); if(!rating||!comment) { showToast('Please provide both.','warning'); return; } try { await apiCall('/feedback.php', { method:'POST', body:JSON.stringify({ reservation_id: parseInt(reservationId), rating, comment }) }); showToast('Thank you for your feedback!','success'); setTimeout(()=>window.location.href='booking-history.html',1500); } catch(err) { showToast(err.message,'error'); } }
  async function setupNav() {
  const s = await checkSession();
  const navDiv = document.getElementById('mainNav');
  if (!navDiv) return;
  const u = s.loggedIn ? s.user : null;
  if (!u || u.role === 'customer') {
    navDiv.innerHTML = `<a class="nav-link" href="index.html">Restaurants</a><a class="nav-link" href="booking-history.html">My Bookings</a><a class="nav-link" href="order-status.html">Order Status</a>`;
  } else if (u.role === 'staff') {
    navDiv.innerHTML = `<a class="nav-link fw-bold" href="staff-dashboard.html">↗ Staff Dashboard</a>`;
  } else if (u.role === 'owner') {
    navDiv.innerHTML = `<a class="nav-link fw-bold" href="owner-dashboard.html">↗ Owner Dashboard</a>`;
  } else if (u.role === 'admin') {
    navDiv.innerHTML = `<a class="nav-link fw-bold" href="admin.html">↗ Admin Dashboard</a>`;
  }
}
  window.addEventListener('DOMContentLoaded', async () => { await nav(); await setupNav(); const ok = await verifyAccess(); if(ok) document.getElementById('feedbackForm').addEventListener('submit', submitFeedback); else document.getElementById('feedbackForm').style.display='none'; });
</script>
</body>
</html>
