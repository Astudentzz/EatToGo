<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback – EatToGo</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .etg-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1C1208; color: white; border-radius: 16px; padding: 14px 24px; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); opacity: 0; transition: all .35s; z-index: 9999; min-width: 300px; pointer-events: none; }
    .etg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .mobile-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
    @media (max-width: 768px) {
      .mobile-nav { flex-direction: column; align-items: center; margin-top: 10px; }
    }
  </style>
</head>
<body>
<div class="etg-toast" id="etgToast"><span class="toast-icon" id="toastIcon">⚠️</span><span id="toastMsg">Message here</span></div>
<nav class="navbar-etg">
  <div class="container">
    <a class="logo" href="index.html">Eat<span>To</span>Go</a>
    <!-- Desktop navigation -->
    <div class="desktop-nav" id="mainNav"></div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button class="hamburger" id="hamburgerBtn">☰</button>
      <div id="authArea"></div>
    </div>
  </div>
</nav>

<!-- Mobile sidebar -->
<div class="mobile-sidebar" id="mobileSidebar">
  <button class="close-sidebar" id="closeSidebarBtn">×</button>
  <div id="mobileNavLinks"></div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<section class="section"><div class="container"><form id="feedbackForm" class="card-etg p-5 mx-auto" style="max-width:680px"><h1>Dining Feedback</h1><p class="text-muted">Please share your experience at the restaurant.</p><label class="fw-bold mb-1">Rating</label><select id="rating" class="form-select mb-3" required><option value="5">5 – Excellent</option><option value="4">4 – Very Good</option><option value="3">3 – Good</option><option value="2">2 – Fair</option><option value="1">1 – Poor</option></select><label class="fw-bold mb-1">Your Feedback</label><textarea id="message" class="form-control mb-3" rows="5" placeholder="Write your experience..." required></textarea><button type="submit" class="btn btn-etg w-100">Submit Feedback</button></form></div></section>
<footer class="minimal-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-5">
    <div class="footer-brand">
      <h2>Eat<span>To</span>Go</h2>
      <p>Final Year Project – Restaurant and Food Reservation System.</p>
    </div>
    <div class="footer-members">
      <h4>Project Team</h4>
      <ul class="list-unstyled">
        <li>Navin Ramu</li>
        <li>Muhamamd Nazim</li>
        <li>Hadif</li>
        <li>Ng Yue Yang</li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">© 2026 EatToGo • Universiti Teknologi Malaysia (UTM)</div>
</footer>
<script src="assets/js/api.js"></script>
<script src="assets/js/mobile-nav.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const reservationId = urlParams.get('reservation_id');
  let toastTimer;
  function showToast(msg, type = 'success', icon = '✅') { const t = document.getElementById('etgToast'); t.className = `etg-toast ${type}`; document.getElementById('toastMsg').textContent = msg; document.getElementById('toastIcon').textContent = icon; clearTimeout(toastTimer); void t.offsetWidth; t.classList.add('show'); toastTimer = setTimeout(() => t.classList.remove('show'), 3800); }
  async function submitFeedback(e) { e.preventDefault(); const rating = document.getElementById('rating').value; const comment = document.getElementById('message').value.trim(); if (!rating || !comment) { showToast('Please provide both rating and feedback.', 'warning', '⚠️'); return; } if (!reservationId) { showToast('Missing reservation ID.', 'error', '❌'); return; } try { await apiCall('/feedback.php', { method: 'POST', body: JSON.stringify({ reservation_id: parseInt(reservationId), rating, comment }) }); showToast('Thank you for your feedback!', 'success', '✅'); setTimeout(() => { window.location.href = 'booking-history.html'; }, 1500); } catch(err) { showToast(err.message, 'error', '❌'); } }
  async function verifyAccess() { const session = await checkSession(); if (!session.loggedIn || session.user.role !== 'customer') { showToast('Please login as customer.', 'warning', '⚠️'); setTimeout(() => { window.location.href = 'login.html'; }, 1500); return false; } if (!reservationId) { showToast('No reservation specified.', 'error', '❌'); setTimeout(() => { window.location.href = 'booking-history.html'; }, 1500); return false; } try { const reservations = await apiCall('/user-reservations.php'); const valid = reservations.some(r => r.id == reservationId); if (!valid) { showToast('Unauthorized.', 'error', '❌'); setTimeout(() => { window.location.href = 'booking-history.html'; }, 1500); return false; } } catch(err) { showToast('Error validating.', 'error', '❌'); return false; } return true; }
  async function setupNav() { const s = await checkSession(); const navDiv = document.getElementById('mainNav'); if (!navDiv) return; const u = s.loggedIn ? s.user : null; if (!u || u.role === 'customer') { navDiv.innerHTML = `<a class="nav-link" href="index.html">Restaurants</a><a class="nav-link" href="booking-history.html">My Bookings</a><a class="nav-link" href="order-status.html">Order Status</a>`; } else if (u.role === 'staff') { navDiv.innerHTML = `<a class="nav-link fw-bold" href="staff-dashboard.html">↗ Staff Dashboard</a>`; } else if (u.role === 'owner') { navDiv.innerHTML = `<a class="nav-link fw-bold" href="owner-dashboard.html">↗ Owner Dashboard</a>`; } else if (u.role === 'admin') { navDiv.innerHTML = `<a class="nav-link fw-bold" href="admin.html">↗ Admin Dashboard</a>`; } }
  window.addEventListener('DOMContentLoaded', async () => { await nav(); await setupNav(); const ok = await verifyAccess(); if (ok) { document.getElementById('feedbackForm').addEventListener('submit', submitFeedback); } else { document.getElementById('feedbackForm').style.display = 'none'; } });
</script>
</body>
</html>
