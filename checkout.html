<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><title>Checkout Details – EatToGo</title></head><body>
<nav class="navbar-etg"><div class="container d-flex align-items-center justify-content-between"><a class="logo" href="index.html">Eat<span>To</span>Go</a><div class="d-none d-md-flex gap-4"><a class="nav-link" href="search-results.html">Restaurants</a><a class="nav-link" href="booking-history.html">My Bookings</a><a class="nav-link" href="order-status.html">Order Status</a></div><div id="authArea"></div></div></nav>

<section class="section"><div class="container"><div class="row g-4"><div class="col-lg-7"><form class="card-etg p-4" onsubmit="submitCheckout(event)"><h3>Contact Information</h3><p class="text-muted">These details will appear on the booking receipt and help the restaurant contact you.</p><label class="fw-bold mb-1">Full Name</label><input id="fullName" class="form-control mb-3" required><label class="fw-bold mb-1">Phone Number</label><input id="phone" class="form-control mb-3" placeholder="e.g. 012-3456789" required><label class="fw-bold mb-1">Email</label><input id="email" type="email" class="form-control mb-3" required><label class="fw-bold mb-1">Extra Comments / Requests</label><textarea id="comments" class="form-control mb-4" rows="4" placeholder="Allergies, birthday setup, baby chair, window seat..."></textarea><button class="btn btn-etg w-100">Generate Booking Receipt</button></form></div><div class="col-lg-5"><div id="checkoutSummary" class="summary-card"></div></div></div></div></section>
