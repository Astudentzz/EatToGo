<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Profile – EatToGo Owner</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* (keep all existing styles – exactly the same as staff-profile's style block) */
    :root {
      --orange: #ff6b35;
      --dark-wood: #1C1208;
      --sidebar-width: 280px;
    }
    /* ... copy the full style block from the updated staff-profile above ... */
    /* For brevity, I’ll assume you already have the styles – include all the same classes as staff-profile.
       The key additions are .password-hint and .input-group .btn-outline-secondary. */
  </style>
</head>
<body>

<nav class="navbar-etg">
  <div class="container">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <a class="logo" href="owner-dashboard.html">Eat<span>To</span>Go</a>
    <div class="right-group">
      <div id="authArea" class="auth-buttons"></div>
    </div>
  </div>
</nav>

<div class="mobile-sidebar" id="mobileSidebar">
  <div class="sidebar-header">
    <div class="sidebar-avatar" id="mobileUserAvatar">🍽️</div>
    <div class="sidebar-userinfo" id="mobileUserInfo">
      <div class="user-display-name">Guest</div>
      <div class="user-display-email">sign in to unlock</div>
    </div>
    <button class="close-sidebar" id="closeSidebarBtn">✕</button>
  </div>
  <div class="sidebar-divider"></div>
  <div id="mobileNavLinks" class="sidebar-nav-links"></div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<main class="owner-main">
  <div class="p-4" id="profileContent">
    <div id="loadingState" class="text-center py-5 text-muted">Loading profile…</div>
    <div id="profileBody" style="display:none;">
      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card-etg p-4">
            <div class="d-flex align-items-center gap-3 mb-4">
              <div class="profile-avatar" id="avatarLetter">?</div>
              <div><h4 class="mb-0" id="profileName">—</h4><span class="badge-etg mt-1" style="font-size:12px;">🏪 Shop Owner</span></div>
            </div>
            <div class="info-row"><span class="info-label">Account ID</span><span class="info-value d-flex align-items-center gap-1"><span id="profileId">—</span><button class="copy-btn" onclick="copyText('profileId')">📋</button></span></div>
            <div class="info-row"><span class="info-label">Email</span><span class="info-value d-flex align-items-center gap-1"><span id="profileEmail">—</span><button class="copy-btn" onclick="copyText('profileEmail')">📋</button></span></div>
            <div class="info-row"><span class="info-label">Password</span><span class="info-value d-flex align-items-center gap-1"><span id="profilePassDisplay">••••••••</span><button class="copy-btn" onclick="togglePass()">👁️</button></span></div>
            <div class="info-row"><span class="info-label">Role</span><span class="info-value">🏪 Owner</span></div>
            <div class="info-row"><span class="info-label">Member Since</span><span class="info-value" id="profileJoined">—</span></div>
          </div>
        </div>
        <div class="col-lg-7 d-flex flex-column gap-4">
          <div class="card-etg p-4">
            <h5 class="mb-3">🏬 My Restaurant Branches</h5>
            <div id="branchesList"><p class="text-muted">No approved restaurants yet.</p></div>
          </div>
          <div class="card-etg p-4 edit-section">
            <h5 class="mb-3">✏️ Edit Profile</h5>
            <div class="mb-3"><label class="info-label mb-1 d-block">Display Name</label><input type="text" id="editName"></div>
            <div class="mb-3">
              <label class="info-label mb-1 d-block">New Password <span class="text-muted fw-normal">(leave blank to keep current)</span></label>
              <div class="input-group">
                <input type="password" id="editPassword" class="form-control" placeholder="Enter new password">
                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('editPassword', this)">
                  <i class="bi bi-eye-slash"></i>
                </button>
              </div>
              <div id="passwordStrengthHint" class="password-hint"></div>
            </div>
            <div class="d-flex align-items-center gap-3"><button class="btn btn-etg" onclick="saveProfile()">💾 Save Changes</button><span id="saveMsg" class="text-success fw-bold">✅ Saved!</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="minimal-footer">...</footer>

<script src="assets/js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Copy the same sidebar, auth, and password strength functions from staff-profile.html.
  // The only difference is the profile loading logic (uses owner data).
  // I'll provide the full script, but for brevity I'll show the key additions.

  // ==================== SIDEBAR TOGGLE (same as staff-profile) ====================
  const hamburger = document.getElementById('hamburgerBtn');
  const sidebar = document.getElementById('mobileSidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const closeBtn = document.getElementById('closeSidebarBtn');

  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); document.body.classList.add('sidebar-open'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); document.body.classList.remove('sidebar-open'); }
  if (hamburger) hamburger.addEventListener('click', openSidebar);
  if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if (overlay) overlay.addEventListener('click', closeSidebar);
  document.addEventListener('click', (e) => {
    if (sidebar && sidebar.classList.contains('open')) {
      if (e.target.closest('#mobileNavLinks a')) {
        setTimeout(() => closeSidebar(), 80);
      }
    }
  });

  // ==================== AUTH & SIDEBAR UI ====================
  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

  async function updateAuthAreaOldStyle() { /* same as staff-profile */ }
  async function updateMobileSidebarUI() { /* same as staff-profile */ }
  async function setupEnhancedNav() { /* same as staff-profile but with owner nav */ }

  // ==================== PASSWORD STRENGTH ====================
  function isPasswordStrong(password) {
    const minLength = 8;
    const hasUppercase = /[A-Z]/.test(password);
    const hasLowercase = /[a-z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);
    const isLongEnough = password.length >= minLength;
    return isLongEnough && hasUppercase && hasLowercase && hasNumber && hasSpecial;
  }

  function getPasswordStrengthMessage(password) {
    const checks = [
      { condition: password.length >= 8, text: "At least 8 characters" },
      { condition: /[A-Z]/.test(password), text: "At least one uppercase letter" },
      { condition: /[a-z]/.test(password), text: "At least one lowercase letter" },
      { condition: /[0-9]/.test(password), text: "At least one number" },
      { condition: /[!@#$%^&*(),.?":{}|<>]/.test(password), text: "At least one special character (!@#$%^&* etc.)" }
    ];
    const failed = checks.filter(c => !c.condition).map(c => c.text);
    if (failed.length === 0) return "✅ Strong password";
    return "❌ " + failed.join(", ");
  }

  function updatePasswordHint() {
    const password = document.getElementById('editPassword').value;
    const hintDiv = document.getElementById('passwordStrengthHint');
    if (!hintDiv) return;
    if (password === "") {
      hintDiv.innerHTML = "";
      hintDiv.classList.remove('valid', 'invalid');
    } else if (isPasswordStrong(password)) {
      hintDiv.innerHTML = "✅ Strong password";
      hintDiv.classList.add('valid');
      hintDiv.classList.remove('invalid');
    } else {
      hintDiv.innerHTML = getPasswordStrengthMessage(password);
      hintDiv.classList.add('invalid');
      hintDiv.classList.remove('valid');
    }
  }

  function togglePasswordVisibility(inputId, btnElement) {
    const input = document.getElementById(inputId);
    const icon = btnElement.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('bi-eye-slash');
      icon.classList.add('bi-eye');
    } else {
      input.type = 'password';
      icon.classList.remove('bi-eye');
      icon.classList.add('bi-eye-slash');
    }
  }

  // ==================== PROFILE LOGIC ====================
  async function loadProfile() {
    const session = await checkSession();
    if (!session.loggedIn || session.user.role !== 'owner') { alert('Unauthorized'); window.location.href='login.html'; return; }
    try {
      const data = await apiCall('/profile.php');
      document.getElementById('avatarLetter').textContent = (data.name || '?')[0].toUpperCase();
      document.getElementById('profileName').textContent = data.name || '—';
      document.getElementById('profileId').textContent = '#' + data.id;
      document.getElementById('profileEmail').textContent = data.email || '—';
      document.getElementById('profileJoined').textContent = data.created_at ? data.created_at.slice(0,10) : '—';
      document.getElementById('editName').value = data.name || '';
      const container = document.getElementById('branchesList');
      if (data.restaurants && data.restaurants.length) {
        container.innerHTML = data.restaurants.map(r => `
          <div class="branch-badge w-100">
            <div style="flex:1">
              <div class="d-flex align-items-center gap-2 mb-1"><span style="font-size:18px;">🍽️</span><strong>${escapeHtml(r.name)}</strong><span class="branch-status ${r.status}">${r.status}</span></div>
              <div style="font-size:13px; color:#9a7a5a;">📍 ${escapeHtml(r.location)} &nbsp;·&nbsp; 🍜 ${escapeHtml(r.category)} &nbsp;·&nbsp; ID: <strong>#${r.id}</strong></div>
            </div>
          </div>
        `).join('');
      } else { container.innerHTML = '<p class="text-muted mb-0">No restaurants yet. Submit a listing request to get started.</p>'; }
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('profileBody').style.display = 'block';
      const pwdInput = document.getElementById('editPassword');
      if (pwdInput) pwdInput.addEventListener('input', updatePasswordHint);
    } catch(e) { document.getElementById('loadingState').textContent = 'Failed to load profile.'; console.error(e); }
  }

  function togglePass() { const el = document.getElementById('profilePassDisplay'); el.textContent = el.textContent === '••••••••' ? '(stored securely)' : '••••••••'; }
  function copyText(id) { const text = document.getElementById(id).textContent.replace('#',''); navigator.clipboard.writeText(text); const btn = event.target; btn.textContent = '✅'; setTimeout(() => btn.textContent = '📋', 1500); }
  async function saveProfile() {
    const name = document.getElementById('editName').value.trim();
    const password = document.getElementById('editPassword').value;
    if (!name) { alert('Name cannot be empty'); return; }
    if (password && !isPasswordStrong(password)) {
      alert(getPasswordStrengthMessage(password));
      return;
    }
    try {
      await apiCall('/profile.php', { method: 'PUT', body: JSON.stringify({ name, password }) });
      document.getElementById('profileName').textContent = name;
      document.getElementById('avatarLetter').textContent = name[0].toUpperCase();
      document.getElementById('editPassword').value = '';
      updatePasswordHint();
      const msg = document.getElementById('saveMsg'); msg.style.display = 'inline'; setTimeout(() => msg.style.display = 'none', 2500);
    } catch(e) { alert('Save failed: ' + e.message); }
  }

  window.addEventListener('DOMContentLoaded', async () => {
    await nav();
    await updateAuthAreaOldStyle();
    await setupEnhancedNav();
    await updateMobileSidebarUI();
    await loadProfile();
  });
  window.addEventListener('pageshow', () => { updateMobileSidebarUI(); setupEnhancedNav(); updateAuthAreaOldStyle(); });
</script>
</body>
</html>
